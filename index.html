 e:"Das System erkennt, dass derselbe Inhalt mehrfach vorliegt, und legt ihn nur einmal physisch ab. Je mehr Gleiches im Datenbestand steckt, desto höher die Wirkung."},
{id:"d02",lvl:"basis",t:"ded",q:"Was macht Komprimierung?",
 o:["Sie verkleinert den einzelnen Block","Sie entfernt mehrfach vorhandene Dateien","Sie verschiebt Daten auf langsamere Laufwerke","Sie verschlüsselt die Daten platzsparend"],a:0,
 e:"Komprimierung wirkt lokal innerhalb eines Blocks. Sie findet keine Dubletten an anderer Stelle – dafür ist Deduplizierung zuständig, und beide ergänzen sich."},
{id:"d03",lvl:"basis",t:"ded",q:"Eine Datenreduktionsrate von 5:1 – wie viel Platz wird gespart?",
 o:["50 Prozent","60 Prozent","80 Prozent","20 Prozent"],a:2,
 h:"Aus fünf Teilen wird einer.",
 e:"Fünf Einheiten Rohdaten belegen eine Einheit Kapazität, gespart sind also vier von fünf. 2:1 entspricht 50 Prozent, 10:1 entspricht 90 Prozent – die Skala ist nicht linear."},
{id:"d04",lvl:"tief",t:"ded",q:"Eine Rate von 10:1 wirkt doppelt so gut wie 5:1. Stimmt das?",
 o:["Nein, 5:1 spart 80 Prozent, 10:1 spart 90 Prozent","Ja, die Ersparnis verdoppelt sich tatsächlich","Ja, allerdings nur bei reinen Flash-Systemen","Nein, bei 10:1 fällt die Ersparnis geringer aus"],a:0,
 e:"Der Sprung von 5:1 auf 10:1 bringt nur noch zehn Prozentpunkte. Je höher die genannte Rate, desto geringer der zusätzliche Nutzen – ein beliebter Effekt in Marketingfolien."},
{id:"d05",lvl:"tief",t:"ded",q:"Worin unterscheiden sich Inline- und Post-Process-Verfahren?",
 o:["Inline arbeitet vor dem Schreiben, Post-Process danach","Inline lässt sich nur mit Komprimierung einsetzen","Post-Process arbeitet in jedem Fall schneller","Es ist dasselbe Verfahren mit zwei Namen"],a:0,
 e:"Inline spart die Kapazität sofort, kostet aber CPU und etwas Latenz im Schreibpfad. Post-Process belastet den Schreibpfad nicht, braucht dafür aber eine Landezone in voller Rohgröße."},
{id:"d06",lvl:"tief",t:"ded",q:"Was bringt Deduplizierung mit variabler Blocklänge?",
 o:["Blockgrenzen richten sich nach dem Inhalt","Das Verfahren arbeitet schneller als feste Blöcke","Es wird deutlich weniger Arbeitsspeicher benötigt","Es kommt vollständig ohne Hashwerte aus"],a:0,
 e:"Bei fester Blocklänge macht schon ein eingefügtes Byte am Anfang jeden Folgeblock unkenntlich. Variable Grenzen lösen das und erreichen bei veränderlichen Daten deutlich höhere Raten."},
{id:"d07",lvl:"tief",t:"ded",q:"Was unterscheidet Source-side von Target-side Deduplizierung im Backup?",
 o:["Source-side dedupliziert vor der Übertragung","Target-side arbeitet in jedem Fall effizienter","Source-side greift nur bei Vollsicherungen","Praktisch besteht zwischen beiden kein Unterschied"],a:0,
 e:"Bei Source-side wird nur übertragen, was das Ziel noch nicht kennt – entscheidend bei Außenstellen mit schmaler Anbindung. Der Preis ist Last auf dem Quellsystem."},
{id:"d08",lvl:"tief",t:"ded",q:"Welche Daten lassen sich kaum reduzieren?",
 o:["Komprimierte oder verschlüsselte Daten","Viele gleichartige virtuelle Maschinen","Textdokumente aus der Sachbearbeitung","Protokolldateien einer Datenbank"],a:0,
 e:"Was schon einmal komprimiert wurde, enthält kaum noch Redundanz. Verschlüsselte Daten sehen für das System aus wie Zufall – dort geht die Rate gegen eins zu eins."},
{id:"d09",lvl:"tief",t:"ded",q:"Der Kunde verschlüsselt bereits auf Hostebene. Was folgt für die Datenreduktion auf dem Array?",
 o:["Die Reduktion läuft weitgehend ins Leere","Die Reduktion bleibt davon unbeeinflusst","Die Reduktionsrate verdoppelt sich dadurch","Die Reduktion funktioniert nur noch inline"],a:0,
 e:"Verschlüsselte Blöcke sind unterschiedlich, auch wenn der Klartext identisch war. Array-seitige Verschlüsselung greift nach der Reduktion und erhält die Wirkung – das gehört früh im Gespräch geklärt."},
{id:"d10",lvl:"tief",t:"ded",q:"Bei welchen Workloads ist die Reduktionsrate typischerweise am höchsten?",
 o:["VDI und viele gleichartige virtuelle Maschinen","Videoarchive und unkomprimierte Mediendateien","Verschlüsselte Datenbanken mit hohem Umsatz","Messdaten aus der Fertigung mit Zeitstempel"],a:0,
 e:"Hunderte Desktops aus demselben Image teilen fast ihren gesamten Inhalt. Dasselbe gilt für Backups, bei denen sich zwischen zwei Vollsicherungen nur ein kleiner Teil ändert."},
{id:"d11",lvl:"tief",t:"ded",q:"Was bedeutet „effektive Kapazität\“ in einem Datenblatt?",
 o:["Nutzkapazität mal einer angenommenen Reduktionsrate","Die nutzbare Kapazität nach Abzug der Parität","Die Rohkapazität aller verbauten Laufwerke","Die Kapazität nach Abzug der Snapshot-Reserve"],a:0,
 e:"Der Wert enthält eine Annahme über die Daten des Kunden – und die muss nicht zutreffen. In Angeboten gehört immer dazu, welche Rate unterstellt wurde."},
{id:"d12",lvl:"tief",t:"ded",q:"Warum wird nach dem Löschen großer Datenmengen nicht sofort Platz frei?",
 o:["Weil die Freigabe im Hintergrund nachläuft","Weil die Daten erst nach 24 Stunden gelöscht werden","Weil gelöschte Daten in einen Papierkorb wandern","Weil der RAID-Verbund den Platz reserviert"],a:0,
 e:"Freigegebene Blöcke müssen erst eingesammelt und zurück in den Pool gegeben werden. Bei knappem Füllstand ist das ein Punkt, den man dem Kunden vorher erklärt haben sollte."},
{id:"d13",lvl:"tief",t:"ded",q:"Wofür sind UNMAP beziehungsweise TRIM da?",
 o:["Damit der Host freigewordene Blöcke meldet","Damit defekte Blöcke erkannt und ersetzt werden","Damit die Integrität der Daten geprüft wird","Damit die Last auf mehrere Pfade verteilt wird"],a:0,
 e:"Ohne diese Rückmeldung hält das Array einmal beschriebene Blöcke für belegt. Thin-Volumes wachsen dann immer weiter, obwohl im Dateisystem längst gelöscht wurde."},
{id:"d14",lvl:"tief",t:"ded",q:"Was bedeutet Rehydrierung?",
 o:["Das Zusammensetzen deduplizierter Daten beim Lesen","Das Wiederherstellen versehentlich gelöschter Daten","Das Neuaufbauen eines ausgefallenen RAID-Verbunds","Das Entschlüsseln der Daten beim Zugriff"],a:0,
 e:"Was stark dedupliziert geschrieben wurde, muss beim Lesen aus vielen verstreuten Fragmenten zusammengeführt werden. Bei Restores aus Dedup-Appliances ist das der häufigste Grund für enttäuschende Rückspielzeiten."},
{id:"d15",lvl:"tief",t:"ded",q:"Was unterscheidet globale von lokaler Deduplizierung?",
 o:["Global über den Pool, lokal nur je Volume oder Job","Global funktioniert ausschließlich in der Cloud","Lokal arbeitet in jedem Fall effizienter","Global setzt zusätzlich Komprimierung voraus"],a:0,
 e:"Je größer der Betrachtungsbereich, desto mehr Dubletten werden gefunden. Bei Vergleichen zwischen Herstellern ist das einer der Gründe für stark abweichende Raten."},
{id:"d16",lvl:"tief",t:"ded",q:"Warum ersetzt Komprimierung keine Deduplizierung?",
 o:["Weil sie nur innerhalb eines Blocks arbeitet","Weil sie dafür schlicht zu langsam arbeitet","Weil sie ausschließlich bei Textdaten greift","Weil sie die Daten verlustbehaftet verkleinert"],a:0,
 e:"Zwanzig identische VMs komprimieren sich zwanzigmal einzeln. Erst die Deduplizierung erkennt, dass es derselbe Inhalt ist – deshalb setzen Arrays beides hintereinander ein."},
{id:"d17",lvl:"tief",t:"ded",q:"Was ist Zero-Block-Erkennung?",
 o:["Blöcke aus lauter Nullen werden nur vermerkt","Defekte Blöcke werden erkannt und ersetzt","Leere Dateien werden beim Schreiben übersprungen","Über jeden Block wird eine Prüfsumme gebildet"],a:0,
 e:"Frisch angelegte, thick provisionierte Volumes bestehen zum großen Teil aus Nullen. Das treibt ausgewiesene Reduktionsraten nach oben, ohne dass echte Nutzdaten reduziert wurden."},
{id:"d18",lvl:"tief",t:"ded",q:"Zwei Hersteller nennen 4:1 und 5:1. Was prüfst du, bevor du das vergleichst?",
 o:["Worauf sich die Rate bezieht","Den Preis pro TB im Angebot","Die Leistung der Controller","Die Größe der Laufwerke"],a:0,
 e:"Manche Hersteller rechnen Thin Provisioning und Klone mit, andere weisen nur echte Deduplizierung und Komprimierung aus. Ohne gleiche Bezugsbasis vergleichst du zwei verschiedene Größen."},

{id:"w01",lvl:"basis",t:"virt",v:"vmw",q:"Was ist ESXi?",
 o:["Der Hypervisor, der direkt auf der Hardware läuft","Die zentrale Verwaltungsoberfläche von VMware","Ein Clusterdateisystem für virtuelle Maschinen","Ein Agent für die Sicherung der VMs"],a:0,
 e:"ESXi ist ein Typ-1-Hypervisor: Er läuft unmittelbar auf dem Server, ohne darunterliegendes Betriebssystem. Die Verwaltung mehrerer Hosts übernimmt vCenter."},
{id:"w02",lvl:"basis",t:"virt",v:"vmw",q:"Wofür wird vCenter gebraucht?",
 o:["Zur zentralen Verwaltung mehrerer ESXi-Hosts","Zum Starten einzelner virtueller Maschinen","Als Ablageort für die Dateien der VMs","Zur Lizenzierung der Gastbetriebssysteme"],a:0,
 e:"Ein einzelner ESXi-Host läuft auch ohne vCenter. Alle Cluster-Funktionen hängen aber daran, weshalb vCenter in jeder Angebotskalkulation auftauchen muss."},
{id:"w03",lvl:"basis",t:"virt",q:"Was unterscheidet einen Typ-1- von einem Typ-2-Hypervisor?",
 o:["Typ 1 läuft direkt auf der Hardware, Typ 2 darüber","Typ 1 ist kostenpflichtig, Typ 2 ist kostenlos","Typ 1 kann ausschließlich Linux virtualisieren","Typ 2 arbeitet spürbar schneller als Typ 1"],a:0,
 e:"ESXi, AHV und Hyper-V sind Typ 1 und für den Rechenzentrumsbetrieb gedacht. VirtualBox oder VMware Workstation sind Typ 2 und laufen als Anwendung auf einem Desktop."},
{id:"w04",lvl:"basis",t:"virt",v:"vmw",q:"Was ist VMFS?",
 o:["Das Clusterdateisystem von VMware auf Blockspeicher","Ein Protokoll zur Anbindung von Speichersystemen","Ein Verfahren zur Reduktion von Daten im Datastore","Das Dateiformat einer virtuellen Festplatte"],a:0,
 e:"VMFS regelt über verteilte Sperren, dass mehrere ESXi-Hosts dieselbe LUN gleichzeitig nutzen können. Bei NFS-Datastores entfällt es, dort bringt das Storage das Dateisystem mit."},
{id:"w05",lvl:"basis",t:"virt",v:"vmw",q:"Was macht vMotion?",
 o:["Es verschiebt eine laufende VM auf einen anderen Host","Es sichert eine VM auf ein zweites Speichersystem","Es startet eine VM nach einem Hostausfall neu","Es kopiert eine virtuelle Maschine in die Cloud"],a:0,
 e:"Der Arbeitsspeicher wird im laufenden Betrieb übertragen, der Umschaltmoment liegt im Millisekundenbereich. Voraussetzung ist gemeinsamer Speicher oder, bei vSphere, die Variante ohne Shared Storage."},
{id:"w06",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet vMotion von Storage vMotion?",
 o:["vMotion verschiebt den Rechenort, Storage den Ablageort","Storage vMotion ist die ältere der beiden Bezeichnungen","vMotion funktioniert nur innerhalb desselben Racks","Zwischen beiden besteht kein funktionaler Unterschied"],a:0,
 e:"Mit vMotion wechselt die VM den Host, mit Storage vMotion wechseln ihre Dateien den Datastore. Letzteres ist das Werkzeug für Storage-Migrationen im laufenden Betrieb."},
{id:"w07",lvl:"basis",t:"virt",v:"vmw",q:"Was macht vSphere HA bei einem Hostausfall?",
 o:["Es startet die betroffenen VMs auf anderen Hosts neu","Es führt die betroffenen VMs unterbrechungsfrei weiter","Es verschiebt die VMs rechtzeitig vor dem Ausfall","Es erstellt vom Zustand der VMs eine Sicherung"],a:0,
 e:"HA bedeutet Neustart, nicht unterbrechungsfreien Betrieb. Die VMs sind also kurz weg – ein Punkt, den Kunden regelmäßig anders erwarten, als er tatsächlich funktioniert."},
{id:"w08",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet Fault Tolerance von HA?",
 o:["FT führt eine synchrone Schattenkopie der VM mit","FT ist die günstigere Variante von HA","FT ersetzt in kleinen Umgebungen das Backup","FT funktioniert ausschließlich mit NFS"],a:0,
 e:"FT läuft wirklich unterbrechungsfrei, kostet aber doppelte Ressourcen und ist bei der Anzahl der vCPUs stark begrenzt. Es ist eine Ausnahmelösung für einzelne kritische VMs, kein Clusterkonzept."},
{id:"w09",lvl:"tief",t:"virt",v:"vmw",q:"Was leistet DRS?",
 o:["Es verteilt VMs nach Auslastung auf die Hosts","Es sichert die virtuellen Maschinen automatisch","Es repliziert VMs in ein zweites Rechenzentrum","Es überwacht die Belegung der Datastores"],a:0,
 e:"DRS nutzt vMotion, um Lastspitzen auszugleichen. Es setzt vCenter und gemeinsamen Speicher voraus und ist nicht in jeder Lizenzstufe enthalten."},
{id:"w10",lvl:"tief",t:"virt",q:"Warum ist ein VM-Snapshot kein Backup?",
 o:["Die Delta-Datei liegt auf demselben Datastore","Das Anlegen dauert bei großen VMs zu lange","Ein Snapshot stellt keine Konsistenz her","Pro VM ist nur ein Snapshot zulässig"],a:0,
 e:"Snapshots sind als kurzfristiger Rückfallpunkt gedacht, etwa vor einem Update. Lange laufende Snapshots kosten spürbar Leistung und werden beim Zusammenführen selbst zum Risiko."},
{id:"w11",lvl:"tief",t:"virt",v:"vmw",q:"Wofür steht CBT bei VMware?",
 o:["Cluster Backup Target","Changed Block Tracking","Central Backup Transfer","Compressed Block Transfer"],a:1,
 e:"Ohne CBT müsste jedes Backup die komplette virtuelle Festplatte lesen. Backup-Produkte wie Veeam setzen darauf auf – fehlerhafte CBT-Daten sind eine klassische Ursache für zu große Inkremente."},
{id:"w12",lvl:"tief",t:"virt",v:"vmw",q:"Was ist VAAI?",
 o:["Auslagern von Speicheroperationen an das Array","Ein Netzwerkprotokoll für die Speicheranbindung","Ein Lizenzmodell für erweiterte Speicherfunktionen","Ein Verschlüsselungsverfahren für Datastores"],a:0,
 e:"Kopieren oder Nullsetzen übernimmt das Array selbst, statt die Daten durch den Host zu schleifen. Ob ein Array die Primitive unterstützt, gehört in jede Storage-Bewertung für VMware-Umgebungen."},
{id:"w13",lvl:"tief",t:"virt",v:"vmw",q:"Was sind vVols?",
 o:["VM-granulare Objekte auf dem Array statt einer LUN","Besonders große LUNs für umfangreiche Datastores","Virtuelle Netzwerkadapter innerhalb der VM","Eine Snapshot-Technik des Hypervisors"],a:0,
 e:"Mit vVols kennt das Array die einzelne VM und kann Snapshots, Replikation und QoS je VM anwenden. Der Preis ist eine engere Abhängigkeit von der Array-Integration über VASA."},
{id:"w14",lvl:"tief",t:"virt",v:"vmw",q:"Was ist vSAN?",
 o:["Speicher aus den lokalen Laufwerken der Hosts","Ein Protokoll für die Anbindung von Speichernetzen","Ein externes Speichersystem aus dem Hause VMware","Ein Produkt zur Sicherung virtueller Maschinen"],a:0,
 e:"vSAN macht aus den Hosts selbst das Speichersystem, also hyperkonvergent. In den aktuellen Bundles ist eine Kapazität je lizenziertem Core enthalten, darüber hinaus wird nachlizenziert."},
{id:"w15",lvl:"tief",t:"virt",v:"vmw",q:"Wie verkauft Broadcom VMware heute?",
 o:["Als Abonnement je physischem Core in Bündeln","Als unbefristete Lizenz je verbautem Sockel","Als Abonnement je laufender virtueller Maschine","Als Abonnement je eingerichtetem Cluster"],a:0,
 e:"Unbefristete Lizenzen gibt es nicht mehr, vSphere Standard und Enterprise Plus wurden in die Bündel überführt. Gezählt werden physische Kerne, nicht Sockel oder VMs."},
{id:"w16",lvl:"tief",t:"virt",v:"vmw",q:"Ein Server hat zwei Prozessoren mit je acht Kernen. Wie viele Cores sind bei VMware zu lizenzieren?",
 o:["16","32","8","24"],a:1,
 h:"Es gilt ein Mindestwert je Prozessor.",
 e:"Broadcom setzt mindestens 16 Kerne je Prozessor an, auch wenn physisch weniger verbaut sind. Zwei Prozessoren ergeben also 32 Cores – bei kleinen CPUs ein erheblicher Kostentreiber, der in die Serverauswahl gehört."},
{id:"w17",lvl:"tief",t:"virt",v:"vmw",q:"Worin unterscheiden sich VVF und VCF?",
 o:["VCF enthält zusätzlich NSX und mehr vSAN je Core","VVF ist die Variante für den Betrieb in der Cloud","VVF kommt ohne vCenter und ohne Verwaltung aus","VCF ist ausschließlich für Edge-Umgebungen gedacht"],a:0,
 e:"VVF deckt Virtualisierung und Betrieb ab, VCF den kompletten Private-Cloud-Stack. Wer kein softwaredefiniertes Netzwerk braucht, zahlt bei VCF für Funktionen, die ungenutzt bleiben."},
{id:"w18",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet thin von thick provisionierten virtuellen Festplatten?",
 o:["Thin belegt erst beim Schreiben, thick sofort","Thick arbeitet in jedem Fall langsamer als thin","Thin lässt sich nur auf NFS-Datastores nutzen","Es betrifft allein die Snapshot-Fähigkeit"],a:0,
 e:"Thin spart Platz, erfordert aber Überwachung des Datastores. Gefährlich wird die Kombination aus thin auf Hypervisor-Ebene und thin auf Array-Ebene, wenn niemand den realen Füllstand im Blick hat."},
{id:"w19",lvl:"basis",t:"virt",v:"vmw",q:"Was ist ein Cluster Shared Volume (CSV) bei Hyper-V?",
 o:["Ein Volume für den Zugriff mehrerer Knoten","Ein gespiegeltes Volume über zwei Standorte","Ein Volume für die Clusterkonfiguration","Ein Volume für die Daten des Quorums"],a:0,
 e:"Das CSV ist bei Hyper-V das Gegenstück zum VMFS-Datastore: gemeinsamer Blockspeicher, auf dem die VMs mehrerer Knoten liegen. Dazu kommt als Alternative die Ablage auf einer SMB3-Freigabe."},
{id:"w20",lvl:"basis",t:"virt",v:"vmw",q:"Welches Dateiformat nutzen virtuelle Festplatten unter Hyper-V?",
 o:["VMDK","VHDX","QCOW2","VDI"],a:1,
 e:"VHDX ist der Nachfolger von VHD und bei Hyper-V Standard. VMDK ist das VMware-Format, QCOW2 stammt aus der KVM-Welt – bei Migrationen muss konvertiert werden."},
{id:"w21",lvl:"basis",t:"virt",v:"vmw",q:"Was ist AHV?",
 o:["Ein Typ-1-Hypervisor auf KVM-Basis","Die Verwaltungsoberfläche von Nutanix","Ein Speicherprotokoll aus dem Hause Nutanix","Ein Produkt zur Sicherung der Cluster"],a:0,
 e:"AHV ist in der Nutanix-Lizenz enthalten und verursacht keine separaten Hypervisor-Kosten. Genau das ist seit der Broadcom-Umstellung sein stärkstes Verkaufsargument."},
{id:"w22",lvl:"tief",t:"virt",v:"vmw",q:"Was ist die CVM bei Nutanix?",
 o:["Eine Controller-VM je Knoten für den Storage-I/O","Eine zentrale Verwaltungsinstanz für den Cluster","Eine VM für Clusterdienste im Bereitschaftsbetrieb","Die Bezeichnung des Nutanix-Dateisystems"],a:0,
 e:"Jeder Knoten ist damit sein eigener Speichercontroller, einen zentralen Flaschenhals gibt es nicht. Die CVM braucht dafür fest zugewiesene CPU und RAM – das muss bei der Dimensionierung abgezogen werden."},
{id:"w23",lvl:"tief",t:"virt",v:"vmw",q:"Was bedeutet Datenlokalität bei Nutanix?",
 o:["Die Daten liegen bevorzugt auf dem Knoten der VM","Die Daten dürfen das Rechenzentrum nicht verlassen","Sämtliche Daten liegen auf einem zentralen Knoten","Die Daten werden je nach Standort verschlüsselt"],a:0,
 e:"Lesezugriffe bleiben dadurch lokal und sparen den Weg über das Netz. Nach einer Migration zieht Nutanix die Daten nach, bis die Lokalität wiederhergestellt ist."},
{id:"w24",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet Prism Element von Prism Central?",
 o:["Element verwaltet einen Cluster, Central mehrere","Prism Central ist die ältere der beiden Versionen","Prism Element läuft ausschließlich mit ESXi","Prism Central dient allein der Datensicherung"],a:0,
 e:"Prism Element ist auf jedem Cluster vorhanden. Prism Central kommt als eigene VM hinzu und ist Voraussetzung für übergreifende Funktionen – das wird bei Konfigurationen gern vergessen."},
{id:"w25",lvl:"tief",t:"virt",v:"vmw",q:"Was bedeutet RF2 beziehungsweise RF3 bei Nutanix?",
 o:["Der Replikationsfaktor: zwei oder drei Kopien","Die Anzahl der Netzwerkpfade je Knoten","Die Anzahl der Controller-VMs je Knoten","Die RAID-Stufe der lokalen Laufwerke"],a:0,
 e:"RF2 verkraftet den Ausfall eines Knotens, RF3 den von zweien – kostet dafür aber ein Drittel statt der Hälfte der Rohkapazität zusätzlich. RF3 verlangt zudem eine Mindestanzahl Knoten."},
{id:"w26",lvl:"basis",t:"virt",q:"Was kennzeichnet eine hyperkonvergente Infrastruktur (HCI)?",
 o:["Compute und Storage stecken in denselben Knoten","Server und Storage stammen vom selben Hersteller","Alle Komponenten sind in einem Rack verbaut","Die Virtualisierung läuft beim Cloud-Anbieter"],a:0,
 e:"Die lokalen Laufwerke aller Knoten bilden per Software einen gemeinsamen Speicher. Erweitert wird knotenweise, wodurch Rechenleistung und Kapazität immer zusammen wachsen – der zentrale Nachteil gegenüber disaggregierten Systemen."},
{id:"w27",lvl:"tief",t:"virt",q:"Was bedeutet Overcommitment?",
 o:["Mehr virtuelle Ressourcen als physisch vorhanden","Die Zusage einer besonders hohen Verfügbarkeit","Die Überbuchung des Platzes im Datastore","Der Betrieb über der zulässigen Temperatur"],a:0,
 e:"Bei CPU ist das üblich und unkritisch, solange nicht alle VMs gleichzeitig Last erzeugen. Bei Arbeitsspeicher wird es schnell gefährlich, weil der Hypervisor dann auf Auslagerung ausweichen muss."},
{id:"w28",lvl:"tief",t:"virt",q:"Was sagt eine hohe CPU Ready Time aus?",
 o:["Die VM wartet auf freie physische Kerne","Die VM ist besonders schnell gestartet","Der Prozessor des Hosts läuft zu heiß","Die VM hat zu wenig Arbeitsspeicher"],a:0,
 e:"Die VM ist bereit, bekommt aber keine Rechenzeit zugeteilt. Das ist der verlässlichste Indikator dafür, dass ein Host überbucht ist – und oft der eigentliche Grund hinter Beschwerden über Langsamkeit."},
{id:"w29",lvl:"tief",t:"virt",q:"Warum macht das Zuweisen weiterer vCPUs eine VM nicht zwangsläufig schneller?",
 o:["Weil breite VMs auf gleichzeitig freie Kerne warten","Weil der Hypervisor zusätzliche vCPUs ignoriert","Weil die Lizenzierung die Zahl der vCPUs begrenzt","Weil vCPUs nur beim Start der VM gezählt werden"],a:0,
 e:"Der Scheduler muss für eine VM mit acht vCPUs genügend Kerne gleichzeitig bereitstellen. Auf einem ausgelasteten Host wartet diese VM länger als eine mit zwei vCPUs – mehr zuweisen verschlimmert das Problem oft."},
{id:"w30",lvl:"tief",t:"virt",v:"vmw",q:"Ein Kunde will wegen der VMware-Kosten wechseln und hat drei Hosts mit externem Storage. Worauf weist du bei Nutanix hin?",
 o:["Nutanix ist hyperkonvergent, das Array entfällt","Nutanix läuft auf der vorhandenen Hardware weiter","Nutanix setzt zwingend ein FC-SAN voraus","Der Wechsel ist ohne Migration der VMs möglich"],a:0,
 e:"Der Kostenvergleich muss deshalb die Abschreibung des vorhandenen Storage und die Migration enthalten, nicht nur die Lizenzen. Umgekehrt entfällt bei AHV der separate Hypervisor-Posten – beides gehört in dieselbe Rechnung."}
,
{id:"g01",lvl:"basis",t:"virt",q:"Was macht ein Hypervisor?",
 o:["Er teilt die Ressourcen auf getrennte VMs auf","Er beschleunigt den Server durch Zwischenspeicher","Er verbindet mehrere Server zu einem Verbund","Er verwaltet die Sicherung der Systeme"],a:0,
 e:"Der Hypervisor sitzt zwischen Hardware und den virtuellen Maschinen und teilt CPU, Arbeitsspeicher, Netz und Speicher zu. Die VMs sind dabei gegeneinander abgeschottet."},
{id:"g02",lvl:"basis",t:"virt",q:"Was ist eine virtuelle Maschine technisch gesehen?",
 o:["Ein Betriebssystem als Satz von Dateien","Ein Prozess im Betriebssystem des Hosts","Eine Kopie des Host-Betriebssystems","Ein Container mit einer Anwendung"],a:0,
 e:"Weil eine VM aus Dateien besteht, lässt sie sich kopieren, verschieben und sichern wie Daten. Genau das ist der eigentliche Gewinn der Virtualisierung gegenüber physischen Servern."},
{id:"g03",lvl:"tief",t:"virt",q:"Was ist eine vCPU?",
 o:["Ein virtueller Kern, den der Scheduler verteilt","Ein dauerhaft fest zugewiesener physischer Kern","Ein halber physischer Kern mit Hyperthreading","Ein physischer Kern, der in Reserve gehalten wird"],a:0,
 e:"Es gibt keine feste Zuordnung. Mehrere VMs teilen sich dieselben physischen Kerne, was Überbuchung erst möglich macht – und bei zu hoher Last zu Wartezeiten führt."},
{id:"g04",lvl:"tief",t:"virt",q:"Wozu dienen die Gast-Erweiterungen beziehungsweise paravirtualisierten Treiber?",
 o:["Sie ersetzen emulierte Geräte durch Treiber","Sie lizenzieren das Gastbetriebssystem","Sie verschlüsseln die Festplatten der VM","Sie erzeugen die Snapshots der VM"],a:0,
 e:"Ohne sie spricht die VM mit nachgebildeter Standardhardware, was spürbar Leistung kostet. Fehlende oder veraltete Gast-Erweiterungen sind eine der häufigsten Ursachen für unerklärlich langsame VMs."},
{id:"g05",lvl:"basis",t:"virt",q:"Was ist Live-Migration?",
 o:["Das Verschieben einer laufenden VM ohne Abschaltung","Das Kopieren einer VM auf ein Sicherungssystem","Der Neustart einer VM nach einem Hostausfall","Das Umziehen einer VM zu einem Cloud-Anbieter"],a:0,
 e:"Der Arbeitsspeicher wird im Betrieb übertragen, der eigentliche Umschaltmoment ist sehr kurz. Das ist die Grundlage für Wartung ohne Ausfallzeit."},
{id:"g06",lvl:"tief",t:"virt",q:"Welche Voraussetzungen hat Live-Migration typischerweise?",
 o:["Gemeinsamer Speicher, kompatible CPUs, Bandbreite","Baugleiche Hardware auf allen beteiligten Hosts","Ein zweites Rechenzentrum als Ausweichstandort","Abgeschaltete Snapshots auf der betroffenen VM"],a:0,
 e:"Varianten ohne gemeinsamen Speicher gibt es inzwischen, sie übertragen dann zusätzlich die Festplattendaten. Die Prozessorkompatibilität bleibt aber in jedem Fall eine Bedingung."},
{id:"g07",lvl:"tief",t:"virt",q:"Warum müssen Prozessoren in einem Virtualisierungscluster zueinander passen?",
 o:["Weil die VM den Befehlssatz ihrer CPU sieht","Weil sonst der Takt auf den kleinsten Wert fällt","Weil die Lizenzierung gleiche Modelle verlangt","Weil der Hypervisor nur einen CPU-Typ erlaubt"],a:0,
 e:"Hypervisor lösen das, indem sie clusterweit einen gemeinsamen Befehlssatz erzwingen und neuere Funktionen ausblenden. Beim Mischen von Servergenerationen gehört dieser Punkt vorab geprüft."},
{id:"g08",lvl:"basis",t:"virt",q:"Was ist ein Virtualisierungscluster?",
 o:["Mehrere Hosts, die sich bei Ausfall vertreten","Ein einzelner Server mit besonders vielen VMs","Ein Verbund mehrerer Speichersysteme","Mehrere VMs mit derselben Aufgabe"],a:0,
 e:"Der Verbund braucht gemeinsamen Speicher oder verteilten Speicher, eine Verwaltungsinstanz und ein Verfahren zur Mehrheitsfindung. Erst dann lassen sich Ausfälle automatisch abfangen."},
{id:"g09",lvl:"tief",t:"virt",q:"Was unterscheidet Hochverfügbarkeit von Lastverteilung im Cluster?",
 o:["HA reagiert auf Ausfälle, Lastverteilung auf Auslastung","Die beiden Begriffe bezeichnen dieselbe Funktion","Die Lastverteilung lässt sich nur manuell auslösen","Hochverfügbarkeit setzt mindestens drei Knoten voraus"],a:0,
 e:"Das eine startet VMs nach einem Hostausfall neu, das andere verschiebt sie im Normalbetrieb dorthin, wo Luft ist. Beides sind getrennte Funktionen und oft auch getrennt lizenziert."},
{id:"g10",lvl:"basis",t:"virt",q:"Was ist ein Datenspeicher (Datastore) in der Virtualisierung?",
 o:["Der Bereich, in dem die Dateien der VMs liegen","Der Arbeitsspeicher, den die VMs gemeinsam nutzen","Die Datenbank der zentralen Verwaltungssoftware","Das Ziel, auf das die Sicherungen geschrieben werden"],a:0,
 e:"Je nach Anbindung liegt darunter eine LUN mit Clusterdateisystem oder eine Dateifreigabe. Für den Betrieb ist vor allem der Füllstand kritisch – ein volllaufender Datenspeicher legt alle VMs darauf still."},
{id:"g11",lvl:"tief",t:"virt",q:"Welches Risiko entsteht, wenn sowohl der Hypervisor als auch das Array dünn provisionieren?",
 o:["Doppelte Überbuchung, der Füllstand wird unklar","Die Schreibleistung halbiert sich auf beiden Ebenen","Snapshots lassen sich nicht mehr korrekt anlegen","Die Kapazität wird in beiden Ebenen doppelt gezählt"],a:0,
 e:"Beide Ebenen melden freien Platz, den es physisch nicht gibt. Entweder man provisioniert nur auf einer Ebene dünn, oder die Überwachung muss beide Ebenen zusammen betrachten."},
{id:"g12",lvl:"tief",t:"virt",q:"Was ist Memory Ballooning?",
 o:["Der Hypervisor fordert ungenutzten Speicher zurück","Der Arbeitsspeicher wird im Betrieb vergrößert","Speicherinhalte werden auf die Festplatte ausgelagert","Der Arbeitsspeicher wird im Hintergrund komprimiert"],a:0,
 e:"Der Gast gibt freiwillig her, was er nicht braucht – das ist der schonendste Weg bei Speicherknappheit. Voraussetzung ist der Ballooning-Treiber aus den Gast-Erweiterungen."},
{id:"g13",lvl:"tief",t:"virt",q:"Was passiert bei Überbuchung des Arbeitsspeichers, wenn physisch nichts mehr frei ist?",
 o:["Der Hypervisor lagert auf den Datenspeicher aus","Die betroffenen VMs werden automatisch pausiert","Neue VMs starten nicht, laufende bleiben unberührt","Der Host startet sich selbsttätig neu"],a:0,
 e:"Auslagerung bedeutet, dass Arbeitsspeicherzugriffe plötzlich über das Speichersystem laufen. Deshalb ist Überbuchung bei CPU alltäglich, bei Arbeitsspeicher dagegen mit Vorsicht zu planen."},
{id:"g14",lvl:"tief",t:"virt",q:"Wie funktioniert ein Snapshot technisch?",
 o:["Der Stand friert ein, Änderungen gehen ins Delta","Es wird eine vollständige Kopie der VM angelegt","Die VM wird kurz angehalten und dabei gesichert","Es werden ausschließlich Metadaten gesichert"],a:0,
 e:"Deshalb kostet ein Snapshot zunächst kaum Platz, wächst aber mit jeder Änderung. Und deshalb dauert das Zusammenführen nach Tagen oder Wochen entsprechend lange."},
{id:"g15",lvl:"tief",t:"virt",q:"Warum reicht ein Snapshot für ein anwendungskonsistentes Backup nicht aus?",
 o:["Weil die Anwendung ihre Puffer erst schreiben muss","Weil Snapshots bei großen VMs zu lange brauchen","Weil Snapshots Datenbankdateien nicht erfassen","Weil sich Snapshots nicht übertragen lassen"],a:0,
 e:"Unter Windows übernimmt das der Schattenkopiedienst, bei Datenbanken gibt es eigene Verfahren. Ohne diesen Schritt bekommt man den Zustand eines abrupten Stromausfalls – oft wiederherstellbar, aber nicht garantiert."},
{id:"g16",lvl:"tief",t:"virt",q:"Was unterscheidet einen Container von einer virtuellen Maschine?",
 o:["Container teilen sich den Kernel des Hosts","Container sind lediglich kleinere VMs","Container lassen sich nur in der Cloud betreiben","Container benötigen keinerlei Speicherplatz"],a:0,
 e:"Der geteilte Kernel macht Container schlank und schnell startbar, die Abschottung ist dafür schwächer als bei einer VM. In der Praxis laufen Container heute meist innerhalb von VMs."},
{id:"g17",lvl:"tief",t:"virt",q:"Was sind Affinitäts- und Anti-Affinitätsregeln?",
 o:["Regeln, die VMs zusammen oder getrennt halten","Regeln für die Zugriffsrechte auf einzelne VMs","Regeln für die Startreihenfolge im Cluster","Regeln für die Zuweisung von Arbeitsspeicher"],a:0,
 e:"Zwei Knoten eines Datenbankclusters auf demselben Host heben die Redundanz auf. Anti-Affinität verhindert genau das – ohne solche Regeln verschiebt die automatische Lastverteilung sie irgendwann zusammen."},
{id:"g18",lvl:"tief",t:"virt",q:"Was ist beim Durchreichen einer GPU an eine VM zu beachten?",
 o:["Die GPU lässt sich auf beliebig viele VMs aufteilen","Die VM ist danach in der Regel nicht mehr live migrierbar","Es wird keine zusätzliche Lizenz benötigt","Der Host verliert den Zugriff auf alle PCIe-Geräte"],a:1,
 e:"Beim exklusiven Durchreichen hängt die VM an genau dieser physischen Karte. Für Wartung ohne Ausfallzeit braucht es stattdessen geteilte Verfahren, die wiederum eigene Lizenzen verlangen."},
{id:"g19",lvl:"basis",t:"virt",q:"Was bewirkt der Wartungsmodus eines Hosts?",
 o:["Der Host wird leergeräumt, die VMs ziehen um","Der Host wird unmittelbar heruntergefahren","Alle VMs auf dem Host werden angehalten","Der Host nimmt ausschließlich neue VMs an"],a:0,
 e:"So lässt sich Firmware oder Hypervisor aktualisieren, ohne dass VMs ausfallen. Voraussetzung ist genug freie Kapazität auf den übrigen Hosts – das ist der eigentliche Grund für die N+1-Auslegung im Cluster."},
{id:"g20",lvl:"tief",t:"virt",q:"Wofür stehen Intel VT-x beziehungsweise AMD-V?",
 o:["Hardwareunterstützung für Virtualisierung","Übertaktungsfunktionen des Prozessors","Befehlssätze für die Verschlüsselung","Energiesparmodi moderner Prozessoren"],a:0,
 e:"Ohne diese Erweiterungen müsste der Hypervisor die Befehle aufwendig nachbilden. Sie sind heute überall vorhanden, können im BIOS aber deaktiviert sein – ein klassischer Stolperstein bei der Erstinstallation."},
{id:"g21",lvl:"tief",t:"virt",q:"Was ist ein Template beziehungsweise Golden Image?",
 o:["Eine Vorlage, aus der neue VMs erzeugt werden","Eine Sicherungskopie einer bestehenden VM","Die Grundkonfiguration des Hypervisors","Ein Snapshot unmittelbar vor einem Update"],a:0,
 e:"Einmal gepflegt, startet jede neue VM mit demselben Stand an Betriebssystem, Treibern und Grundeinstellungen. Bei VDI ist das zugleich die Grundlage für hohe Deduplizierungsraten."},

{id:"c18",lvl:"basis",t:"srv",q:"Was ist ein BMC?",
 o:["Ein Verwaltungsprozessor auf dem Mainboard","Ein Baustein zur Verwaltung des Arbeitsspeichers","Ein Controller für die verbauten Laufwerke","Ein Modul zur Steuerung der Stromversorgung"],a:0,
 e:"Der Baseboard Management Controller arbeitet auch bei ausgeschaltetem Betriebssystem. Jeder Hersteller hat dafür einen eigenen Namen und eigene Lizenzstufen – die Funktion ist im Kern dieselbe."},
{id:"c19",lvl:"basis",t:"srv",q:"Wann ist ein Tower-Server gegenüber einem Rack-Server sinnvoll?",
 o:["Wenn kein Serverschrank vorhanden ist","Wenn besonders hohe Rechenleistung nötig ist","Wenn mehr als zwei Prozessoren gefordert sind","Wenn redundante Netzteile verlangt werden"],a:0,
 e:"Technisch sind beide Bauformen vergleichbar ausgestattet. Entscheidend sind Aufstellungsort, Lautstärke und Kühlung – im Rechenzentrum spricht nichts für Tower."},
{id:"c20",lvl:"tief",t:"srv",q:"Was beschreibt NUMA?",
 o:["Jeder Prozessor hat eigenen lokalen Speicher","Ein Verfahren zur Komprimierung im Speicher","Die Anzahl der Speicherkanäle je Prozessor","Ein Protokoll für die Verbindung der Sockel"],a:0,
 e:"Eine VM, die größer ist als ein NUMA-Knoten, greift zwangsläufig über die Sockelgrenze zu und verliert Leistung. Bei großen VMs gehört die Bestückung deshalb zur Auslegung dazu."},
{id:"c21",lvl:"tief",t:"srv",q:"Was leistet Secure Boot?",
 o:["Es prüft geladene Komponenten gegen Signaturen","Es verschlüsselt die verbauten Festplatten","Es beschleunigt den Startvorgang des Servers","Es sichert die Einstellungen der Firmware"],a:0,
 e:"Damit wird verhindert, dass manipulierter Code vor dem Betriebssystem geladen wird. Die Hersteller setzen zusätzlich eigene, in Hardware verankerte Prüfungen darüber."},
{id:"c22",lvl:"tief",t:"srv",q:"Wofür ist ein TPM im Server da?",
 o:["Als sicherer Speicher für kryptografische Schlüssel","Zur Überwachung der Temperatur im Gehäuse","Zur Verwaltung der redundanten Netzteile","Als Cache für den verbauten RAID-Controller"],a:0,
 e:"Das Trusted Platform Module hält Schlüssel so, dass sie das Modul nicht verlassen. Festplattenverschlüsselung und manche Compliance-Anforderungen setzen es voraus – es gehört also in die Konfiguration."},
{id:"c23",lvl:"tief",t:"srv",q:"Warum ist die PCIe-Generation bei Netzwerk- und Speicheradaptern relevant?",
 o:["Weil ein zu schmaler Steckplatz die Karte ausbremst","Weil sonst die passenden Treiber fehlen können","Weil die Stromaufnahme der Karte davon abhängt","Weil die Baulänge der Karte sonst nicht passt"],a:0,
 e:"Eine 100-GbE-Karte braucht entsprechend viele Lanes der passenden Generation, sonst erreicht sie ihre Rate nie. Steckplatzbelegung und Lane-Aufteilung stehen in den technischen Unterlagen und gehören geprüft."},
{id:"c24",lvl:"tief",t:"srv",q:"Was bedeutet Hot-Plug?",
 o:["Komponenten lassen sich im laufenden Betrieb tauschen","Komponenten werden im Betrieb automatisch erkannt, aber erst nach Neustart genutzt","Komponenten werden vorgewärmt","Die Stromversorgung bleibt beim Tausch an"],a:0,
 e:"Üblich ist das bei Laufwerken, Netzteilen und Lüftern. Nicht alles ist hot-plug-fähig – bei Erweiterungskarten und Arbeitsspeicher gilt das in aller Regel nicht."},
{id:"c25",lvl:"tief",t:"srv",q:"Warum sollten Firmware- und Treiberstände aufeinander abgestimmt sein?",
 o:["Weil nur geprüfte Kombinationen unterstützt werden","Weil sonst der Garantieanspruch verloren geht","Weil ältere Firmware meist schneller arbeitet","Weil der Hersteller es vertraglich vorschreibt"],a:0,
 e:"Hersteller geben ganze Pakete frei, keine Einzelversionen. Abweichende Kombinationen sind eine der häufigsten Ursachen für sporadische Fehler – und im Supportfall das erste, was geprüft wird."},
{id:"c26",lvl:"tief",t:"srv",q:"Wozu dient die Pufferung des Schreibcaches an einem RAID-Controller?",
 o:["Damit der Cache bei Stromausfall nicht verloren geht","Damit Lesezugriffe schneller beantwortet werden","Damit der Cache verschlüsselt abgelegt werden kann","Damit sich die nutzbare Kapazität erhöht"],a:0,
 e:"Ohne Akku oder Flash-Absicherung muss der Schreibcache abgeschaltet bleiben, sonst drohen Datenverluste. Das kostet spürbar Schreibleistung – die Absicherung gehört deshalb in jede Konfiguration mit RAID-Controller."}
,
{id:"p12",lvl:"tief",t:"srv",q:"Welche Fehlerkorrektur ist bei 25GBASE-SR zwingend vorgeschrieben?",
 o:["FEC nach Clause 74","RS-FEC nach Clause 108","Beide gleichzeitig aktiviert","Gar keine, FEC entfällt hier"],a:1,
 e:"Bei 25GBASE-SR ist RS-FEC nach Clause 108 Pflicht. Unterschiedliche FEC-Einstellungen auf beiden Seiten sind eine klassische Ursache für Links, die physisch da sind, aber Fehler zählen."},
{id:"p13",lvl:"tief",t:"srv",q:"Eine 25G-SR-Strecke wird statt über OM4 über OM3 geführt. Welche Folge hat das?",
 o:["Die Reichweite sinkt auf rund 70 Meter","Die Verbindung kommt überhaupt nicht zustande","Die Reichweite bleibt gleich, die Latenz steigt","Es wird zwingend eine andere Optik benötigt"],a:0,
 e:"Die Optik bleibt dieselbe, die Faserqualität begrenzt die Strecke. Bei Verkabelung im Bestand ist die Fasergüte deshalb vor der Auslegung zu klären, nicht danach."},
{id:"p17",lvl:"tief",t:"srv",q:"Woran erkennst du bei Intel Xeon Scalable die Generation?",
 o:["An Produktlinie plus erster Ziffer der SKU-Nummer","Allein an der Höhe der Modellnummer","An der Anzahl der Kerne des Modells","Am Buchstabensuffix am Ende der Bezeichnung"],a:0,
 e:"Die Stufe steht im Namen, die Generation in der ersten Ziffer der Nummer. Für Xeon 6 gilt das nicht mehr, dort wurde das Schema vollständig gewechselt – ein häufiger Anlass für Verwechslungen in Angeboten."},
{id:"p18",lvl:"basis",t:"liz",q:"Wie viele virtualisierte Instanzen deckt eine Windows-Server-Standard-Lizenz ab?",
 o:["Eine virtualisierte Instanz je Lizenz","Zwei virtualisierte Instanzen je Lizenz","Vier virtualisierte Instanzen je Lizenz","Beliebig viele, die Zahl ist nicht begrenzt"],a:1,
 e:"Zwei, sofern alle physischen Kerne lizenziert sind. Wer mehr braucht, stapelt weitere Standard-Lizenzen oder wechselt auf Datacenter mit unbegrenzter Zahl."},
{id:"p19",lvl:"basis",t:"liz",q:"Wofür werden neben der Serverlizenz zusätzlich CALs benötigt?",
 o:["Für jeden zugreifenden Nutzer oder jedes Gerät","Für jeden physischen Prozessor im Server","Für jede eingerichtete virtuelle Maschine","Für jede Netzwerkkarte im betroffenen Server"],a:0,
 e:"Die Serverlizenz deckt die Installation ab, nicht den Zugriff darauf. Zugriffslizenzen werden je Nutzer oder je Gerät gezählt und fehlen in Angeboten regelmäßig."}
,
{id:"o01",lvl:"tief",t:"srv",q:"Was leistet FEC auf einer Ethernet-Strecke?",
 o:["Sie korrigiert Bitfehler ohne erneute Übertragung","Sie verschlüsselt den Datenstrom auf der Faser","Sie verteilt die Last auf mehrere Fasern","Sie komprimiert die Nutzdaten vor dem Senden"],a:0,
 e:"Forward Error Correction legt Redundanz in den Datenstrom, sodass der Empfänger Fehler selbst korrigiert. Das kostet etwas Latenz, erkauft dafür aber Reichweite und Stabilität bei hohen Raten."},
{id:"o02",lvl:"tief",t:"srv",q:"Welche beiden FEC-Varianten begegnen dir im 25G-Umfeld?",
 o:["RS-FEC nach Clause 108 und Fire-Code nach Clause 74","Clause 73 und Clause 110 im Wechsel","Hard-FEC und Soft-FEC je nach Optik","Inline-FEC und Post-FEC je nach Switch"],a:0,
 e:"RS-FEC ist die stärkere Variante und bei 25GBASE-SR vorgeschrieben, Fire-Code die schwächere mit geringerer Latenz. Welche greift, muss auf beiden Seiten übereinstimmen."},
{id:"o03",lvl:"tief",t:"srv",q:"Was passiert bei unterschiedlicher FEC-Einstellung auf beiden Seiten einer Strecke?",
 o:["Der Link kommt nicht hoch oder zählt laufend Fehler","Die Gegenstelle übernimmt automatisch die Einstellung","Die Rate fällt auf die nächstniedrigere Stufe","Es hat keine Auswirkung auf den Betrieb"],a:0,
 e:"Das Tückische ist der Zwischenzustand: Die Verbindung steht scheinbar, Pakete gehen aber verloren. Genau deshalb gehört FEC bei der Inbetriebnahme auf beiden Seiten ausdrücklich geprüft."},
{id:"o04",lvl:"tief",t:"srv",q:"Woran erkennst du im Betrieb, dass eine Strecke Übertragungsfehler hat?",
 o:["An den FEC- und CRC-Zählern der Schnittstelle","An der Auslastung des Ports in Prozent","An der Anzahl der verbundenen Geräte","An der Temperatur des Switch-Gehäuses"],a:0,
 e:"Korrigierte und nicht korrigierbare Blöcke werden getrennt gezählt. Steigende Werte bei normaler Last deuten auf Faser, Stecker oder eine nicht passende Optik hin."},
{id:"o05",lvl:"tief",t:"srv",q:"Wofür steht DOM beziehungsweise DDM bei Transceivern?",
 o:["Auslesen von Pegel, Temperatur und Strom im Betrieb","Automatische Anpassung der Übertragungsrate","Verschlüsselung der optischen Übertragung","Erkennung der Faserlänge beim Einstecken"],a:0,
 e:"Digital Optical Monitoring liefert Sende- und Empfangspegel live aus der Optik. Ein zu niedriger Empfangspegel ist der schnellste Hinweis auf eine verschmutzte oder zu lange Strecke."},
{id:"o06",lvl:"tief",t:"srv",q:"Was kennzeichnet einen BiDi-Transceiver?",
 o:["Er nutzt eine Faser für beide Richtungen","Er überträgt gleichzeitig zwei Datenraten","Er verbindet zwei Switches ohne Patchfeld","Er arbeitet wahlweise mit Kupfer oder Glas"],a:0,
 e:"Senden und Empfangen laufen über zwei Wellenlängen auf derselben Faser. Das halbiert den Faserbedarf, verlangt aber ein zueinander passendes Paar mit vertauschten Wellenlängen."},
{id:"o07",lvl:"basis",t:"srv",q:"Mit welcher Wellenlänge arbeiten SR-Optiken auf Multimode?",
 o:["850 Nanometer","1310 Nanometer","1550 Nanometer","1490 Nanometer"],a:0,
 e:"SR steht für Short Range und nutzt 850 nm auf Multimode. LR arbeitet mit 1310 nm auf Singlemode – Optik und Fasertyp müssen deshalb immer zusammen betrachtet werden."},
{id:"o08",lvl:"tief",t:"srv",q:"Welche Reichweite deckt 10GBASE-LR auf Singlemode-Faser ab?",
 o:["Rund 10 Kilometer","Rund 300 Meter","Rund 2 Kilometer","Rund 40 Kilometer"],a:0,
 e:"LR ist auf 10 km spezifiziert, für längere Strecken gibt es ER und ZR. Kürzer als spezifiziert kann übrigens auch ein Problem sein, wenn der Empfänger übersteuert wird."},
{id:"o09",lvl:"tief",t:"srv",q:"Was handelt die Autonegotiation bei 25G aus?",
 o:["Übertragungsrate und FEC-Verfahren der Strecke","Allein die Duplex-Einstellung des Ports","Die Zuordnung zum passenden VLAN","Die Priorität des Ports im Switch"],a:0,
 e:"Bei 25G gehört die FEC-Variante zur Aushandlung dazu. Wird auf einer Seite fest eingestellt und auf der anderen ausgehandelt, bleibt der Link gern im Fehlerzustand hängen."},
{id:"o10",lvl:"tief",t:"srv",q:"Was passiert, wenn ein SFP28-Modul in einen SFP+-Steckplatz gesteckt wird?",
 o:["Es läuft mit 10G, sofern der Port es akzeptiert","Es läuft weiterhin mit vollen 25G","Der Steckplatz nimmt es mechanisch nicht auf","Der Port wird dauerhaft deaktiviert"],a:0,
 e:"Die Bauform ist identisch, die Rate bestimmt der Port. Viele Switches akzeptieren fremde Module aber nur, wenn sie in der Freigabeliste stehen – die Bauform allein genügt nicht."},

{id:"n01",lvl:"tief",t:"srv",q:"Woran erkennst du bei Intel Xeon Scalable die Generation?",
 o:["An der ersten Ziffer der vierstelligen Nummer","An der letzten Ziffer der vierstelligen Nummer","An der Stufe Silver, Gold oder Platinum","Am Buchstaben am Ende der Bezeichnung"],a:0,
 e:"Die erste Ziffer zählt die Generation, die Stufe steht als Wort davor. Beim Xeon 6 gilt das nicht mehr, dort wurde das Schema vollständig gewechselt."},
{id:"n02",lvl:"tief",t:"srv",q:"Woran erkennst du bei AMD EPYC der 9000er-Reihe die Generation?",
 o:["An der letzten Ziffer der vierstelligen Nummer","An der ersten Ziffer der vierstelligen Nummer","An der Anzahl der Kerne des Modells","Am Buchstaben am Ende der Bezeichnung"],a:0,
 e:"Bei EPYC steht die Generation hinten: 4 bedeutet Genoa, 5 bedeutet Turin. Genau umgekehrt zu Intel – eine der häufigsten Verwechslungen beim Vergleich zweier Angebote."},
{id:"n03",lvl:"tief",t:"srv",q:"Was bedeutet das Suffix P bei einer EPYC-CPU?",
 o:["Nur für Einsockel-Systeme freigegeben","Besonders hohe Taktrate bei wenigen Kernen","Mit zusätzlichem gestapeltem Cache","Für Edge- und Telco-Umgebungen gedacht"],a:0,
 e:"P-Modelle sind günstiger, lassen sich aber nicht zu zweit betreiben. Wer später auf zwei Sockel erweitern will, darf sie nicht einplanen."},
{id:"n04",lvl:"tief",t:"srv",q:"Was bedeutet das Suffix F bei einer EPYC-CPU?",
 o:["Frequenzoptimiert, hoher Takt bei weniger Kernen","Nur für Einsockel-Systeme freigegeben","Mit integrierter Grafikeinheit","Ohne Unterstützung für Virtualisierung"],a:0,
 e:"F-Modelle zielen auf Lasten, die pro Kern lizenziert werden oder schlecht parallelisieren. Bei Datenbanken ist das oft die wirtschaftlichere Wahl als viele langsamere Kerne."},
{id:"n05",lvl:"tief",t:"srv",q:"Wofür stehen P und E bei Intel Xeon 6?",
 o:["Performance-Kerne und Efficient-Kerne","Platinum-Stufe und Economy-Stufe","Prozessor- und Erweiterungsvariante","Produktiv- und Evaluierungsversion"],a:0,
 e:"Beides sind getrennte Produktlinien, nicht gemischte Kerne in einem Chip wie bei Desktop-Prozessoren. P zielt auf Leistung je Kern, E auf Kerndichte und Effizienz."},
{id:"n06",lvl:"tief",t:"srv",q:"Was unterscheidet E-Kerne von P-Kernen bei Xeon 6 technisch?",
 o:["E-Kerne haben kein Hyper-Threading","E-Kerne unterstützen keinen DDR5-Speicher","E-Kerne laufen nur im Einsockel-Betrieb","E-Kerne haben keinen eigenen Cache"],a:0,
 e:"Ein E-Kern entspricht damit einem Thread, ein P-Kern zweien. Bei Lizenzen, die nach Kernen zählen, verschiebt das die Rechnung deutlich."},
{id:"n07",lvl:"tief",t:"srv",q:"Wie viele Speicherkanäle bietet die Xeon-6900P-Reihe je Sockel?",
 o:["Zwölf","Acht","Sechs","Sechzehn"],a:0,
 e:"Die 6900P-Reihe liegt bei zwölf Kanälen, die kleineren 6500P und 6700P bei acht. Das ist bei Speicherbestückung und Bandbreitenzusagen der entscheidende Unterschied."},
{id:"n08",lvl:"tief",t:"srv",q:"Was bedeutet das Suffix U bei Intel Xeon Scalable?",
 o:["Nur für Einsockel-Systeme freigegeben","Für Netzwerk- und NFV-Lasten optimiert","Mit erweitertem Temperaturbereich","Ohne integrierte Beschleuniger"],a:0,
 e:"U ist das Intel-Gegenstück zum P bei EPYC. Beide Hersteller bieten solche Varianten günstiger an, schließen damit aber den späteren Zweisockel-Ausbau aus."},
{id:"n09",lvl:"tief",t:"srv",q:"Was beschreibt cTDP bei einem Serverprozessor?",
 o:["Eine konfigurierbare Obergrenze der Leistungsaufnahme","Die Temperatur, ab der die CPU abschaltet","Den Verbrauch im Leerlauf ohne Last","Die Wärmeabgabe des gesamten Gehäuses"],a:0,
 e:"Derselbe Prozessor lässt sich je nach Plattform in verschiedenen Leistungsfenstern betreiben. Das wirkt direkt auf Takt, Kühlbedarf und die Auslegung der Netzteile."},
{id:"n10",lvl:"tief",t:"srv",q:"Warum ist die reine Kernzahl kein ausreichendes Auswahlkriterium?",
 o:["Takt je Kern und Lizenzkosten wirken gegenläufig","Mehr Kerne senken immer den Gesamtverbrauch","Die Kernzahl bestimmt die Speicherkapazität","Mehr Kerne verlangen zwingend zwei Sockel"],a:0,
 e:"Viele Kerne nützen nichts, wenn die Anwendung schlecht parallelisiert, und sie treiben kernbasierte Lizenzen. Umgekehrt bremsen wenige schnelle Kerne breite Virtualisierung."},

{id:"l01",lvl:"basis",t:"liz",q:"Wonach wird Windows Server lizenziert?",
 o:["Nach den physischen Kernen des Servers","Nach der Anzahl virtueller Maschinen","Nach der Anzahl der Prozessorsockel","Nach dem verbauten Arbeitsspeicher"],a:0,
 e:"Gezählt werden alle physischen Kerne im Server, unabhängig davon, wie viele davon genutzt werden. Erworben wird in Zweierpaketen."},
{id:"l02",lvl:"tief",t:"liz",q:"Welches Lizenzminimum gilt bei Windows Server?",
 o:["16 Kerne je Server und 8 je Prozessor","8 Kerne je Server und 4 je Prozessor","32 Kerne je Server und 16 je Prozessor","Kein Minimum, es zählt die reale Kernzahl"],a:0,
 e:"Ein Einsockel-Server mit acht Kernen kostet damit dasselbe wie einer mit sechzehn. Bei kleinen CPUs verschiebt dieses Minimum die Wirtschaftlichkeit spürbar."},
{id:"l03",lvl:"tief",t:"liz",q:"Wie bekommst du mit Windows Server Standard mehr als zwei virtualisierte Instanzen?",
 o:["Die Lizenz mehrfach auf denselben Server stapeln","Eine Zusatzlizenz je weiterer Instanz erwerben","Das ist mit Standard grundsätzlich ausgeschlossen","Die Kernzahl des Servers entsprechend erhöhen"],a:0,
 e:"Jede zusätzliche volle Kernabdeckung bringt zwei weitere Instanzen. Ab etwa der vierten Stapelung wird Datacenter rechnerisch günstiger – die Schwelle gehört in jedes Angebot gerechnet."},
{id:"l04",lvl:"basis",t:"liz",q:"Was deckt Windows Server Datacenter gegenüber Standard ab?",
 o:["Unbegrenzt viele virtualisierte Instanzen","Doppelt so viele virtualisierte Instanzen","Zusätzlich alle Zugriffslizenzen","Automatisch die Lizenzen der Gastsysteme"],a:0,
 e:"Datacenter hebt die Instanzgrenze auf dem lizenzierten Server auf. Zugriffslizenzen fallen trotzdem an, die sind von der Edition unabhängig."},
{id:"l05",lvl:"tief",t:"liz",q:"Wonach wird NVIDIA vGPU lizenziert?",
 o:["Pro Concurrent User, also pro gleichzeitig laufender VM","Pro physisch verbauter Grafikkarte","Pro Host, unabhängig von der VM-Zahl","Pro zugewiesenem Gigabyte Grafikspeicher"],a:0,
 e:"Ein CCU entspricht einer gleichzeitig aktiven VM, nicht einem benannten Nutzer. Zweihundert Anwender mit fünfzig gleichzeitigen Sitzungen brauchen also fünfzig Lizenzen."},
{id:"l06",lvl:"tief",t:"liz",q:"Welche drei vGPU-Editionen bietet NVIDIA an?",
 o:["vApps, vPC und RTX vWS","Basic, Advanced und Enterprise","Standard, Pro und Datacenter","vGPU, vCompute und vRender"],a:0,
 e:"vApps zielt auf Terminalserver-Anwendungen, vPC auf virtuelle Desktops, RTX vWS auf Workstation-Lasten. Die Editionen unterscheiden sich in Auflösung, Displayzahl und Funktionsumfang."},
{id:"l07",lvl:"tief",t:"liz",q:"Welche vGPU-Edition wird für CUDA und Rechenlasten benötigt?",
 o:["RTX vWS","vPC","vApps","Alle drei gleichermaßen"],a:0,
 e:"vPC und vApps können kein CUDA. Wer in der VM rechnen statt nur darstellen will, braucht vWS – oder bei reinen KI-Lasten die separate AI-Enterprise-Lizenz."},
{id:"l08",lvl:"tief",t:"liz",q:"Wonach wird NVIDIA AI Enterprise gezählt?",
 o:["Pro GPU","Pro Concurrent User","Pro Host im Cluster","Pro Prozessorkern"],a:0,
 e:"Anders als die vGPU-Editionen zählt AI Enterprise die Karten. Bei Rechenlasten im Angebot ist das der Unterschied zwischen zwei Lizenzen und zweihundert."},
{id:"l09",lvl:"tief",t:"liz",q:"Was unterscheidet CLS von DLS bei der vGPU-Lizenzierung?",

const KEY="sp-trainer-v1";
let stats={}, recent=[], flags={}, cfg={lvl:"basis", n:10, topics:["alle"], vend:"alle", mode:"mc"};
try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); stats=p.stats||{}; recent=p.recent||[]; flags=p.flags||{}; if(p.cfg) cfg=Object.assign(cfg,p.cfg);} }catch(e){}
if(!Array.isArray(cfg.topics)) cfg.topics = cfg.topic ? [cfg.topic] : ["alle"];
delete cfg.topic;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({stats,recent,flags,cfg})); }catch(e){} }

const $=id=>document.getElementById(id);
let round=[], idx=0, answered=false, missed=[], results=[];

const GROUPS={"@storage":["proto","kap","ded"]};
function topicOf(q){ return q.t || "proto"; }
function sel(){ return (Array.isArray(cfg.topics) && cfg.topics.length) ? cfg.topics : ["alle"]; }
function expand(t){
  const out=[];
  t.forEach(x=>{ (GROUPS[x]||[x]).forEach(y=>{ if(out.indexOf(y)<0) out.push(y); }); });
  return out;
}
function vendOk(q){
  if(cfg.vend==="neutral") return !q.v;
  if(cfg.vend==="only") return !!q.v;
  return true;
}
function pool(){
  const t=expand(sel()), all=t.indexOf("alle")>-1;
  return POOL.filter(q =>
    (cfg.lvl==="alle" || q.lvl==="basis") &&
    (all || t.indexOf(topicOf(q))>-1) && vendOk(q));
}
function weight(q){
  const s=stats[q.id]||{r:0,w:0};
  let v=1 + 3*s.w - 0.6*s.r;
  if(!s.r && !s.w) v+=2;
  const pos=recent.indexOf(q.id);
  if(pos>-1) v*= 0.25 + 0.05*pos;
  return Math.max(0.3,v);
}
function draw(n){
  const src=pool().slice(), out=[];
  n=Math.min(n,src.length);
  while(out.length<n){
    const tot=src.reduce((a,q)=>a+weight(q),0);
    let r=Math.random()*tot, i=0;
    for(;i<src.length;i++){ r-=weight(src[i]); if(r<=0) break; }
    out.push(src.splice(Math.min(i,src.length-1),1)[0]);
  }
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function segInit(el,key,cast){
  el.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    [...el.children].forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
    cfg[key]=cast(b.dataset.v); save(); info();
  });
  [...el.children].forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.v===String(cfg[key]))));
}
function paintTopics(){
  const t=sel(), e=expand(t);
  [...$("segTopic").children].forEach(c=>{
    const v=c.dataset.v;
    const on = GROUPS[v] ? GROUPS[v].every(x=>e.indexOf(x)>-1) : t.indexOf(v)>-1;
    c.setAttribute("aria-pressed", String(on));
  });
}
$("segTopic").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const v=b.dataset.v;
  let t=sel().slice();
  if(v==="alle"){ t=["alle"]; }
  else if(GROUPS[v]){
    t=t.filter(x=>x!=="alle");
    const e=expand(t), on=GROUPS[v].every(x=>e.indexOf(x)>-1);
    t=t.filter(x=>GROUPS[v].indexOf(x)<0 && x!==v);
    if(!on) t=t.concat(GROUPS[v]);
    if(!t.length) t=["alle"];
  }
  else{
    t=t.filter(x=>x!=="alle");
    t = t.indexOf(v)>-1 ? t.filter(x=>x!==v) : t.concat([v]);
    if(!t.length) t=["alle"];
  }
  cfg.topics=t; save(); paintTopics(); info();
});
paintTopics();
segInit($("segMode"),"mode",v=>v);
segInit($("segVend"),"vend",v=>v);
segInit($("segLevel"),"lvl",v=>v);
segInit($("segCount"),"n",v=>parseInt(v,10));

function info(){
  const p=pool();
  const seen=p.filter(q=>stats[q.id]&&(stats[q.id].r||stats[q.id].w)).length;
  const weak=p.filter(q=>stats[q.id]&&stats[q.id].w>stats[q.id].r).length;
  $("poolInfo").textContent = p.length+" Fragen im Pool · "+seen+" schon beantwortet"+(weak?" · "+weak+" noch wackelig":"");
  $("reset").classList.toggle("hide", seen===0);
  const fc=Object.keys(flags).length;
  $("openFlags").classList.toggle("hide", fc===0);
  $("openFlags").textContent = "Markierte Fragen ("+fc+")";
}
info();

function show(s){ ["start","quiz","end","flags"].forEach(x=>$(x).classList.toggle("hide", x!==s)); window.scrollTo(0,0); }

function start(list){
  round=list.map(q=>({q, opts:shuffle(q.o.map((t,i)=>({t,i})))}));
  idx=0; missed=[]; results=new Array(round.length).fill(null);
  show("quiz"); render();
}
$("go").onclick=()=>start(draw(cfg.n));
$("again").onclick=()=>start(draw(cfg.n));
$("home").onclick=()=>{ info(); show("start"); };
$("back").onclick=()=>{ info(); show("start"); };
$("redo").onclick=()=>start(missed.map(q=>q));
$("reset").onclick=()=>{ stats={}; recent=[]; save(); info(); };

function render(){
  answered=false;
  const cur=round[idx], q=cur.q;
  $("bar").innerHTML = round.map((_,i)=>{
    const r=results[i]; return '<i class="'+(r===true?"ok":r==="half"?"half":r===false?"bad":i===idx?"now":"")+'"></i>';
  }).join("");
  $("pos").textContent="Frage "+(idx+1)+" von "+round.length;
  const tp=topicOf(q);
  const LBL={proto:"Storage & Protokolle", kap:"Kapazität & RAID", ded:"Datenreduktion", srv:"Compute", virt:"Virtualisierung", bak:"Backup & Hochverfügbarkeit", szen:"Konzeption", liz:"Lizenzierung"};
  $("tag").textContent = q.v==="hpe" ? "HPE" : q.v==="vmw" ? "VMware & Nutanix" : (LBL[tp] || "Grundlagen");
  $("qtext").textContent=q.q;
  const keys=["A","B","C","D"];
  $("opts").innerHTML = cur.opts.map((o,i)=>
    '<button class="opt" data-i="'+o.i+'"><span class="k">'+keys[i]+'</span><span>'+o.t+'</span></button>').join("");
  [...$("opts").children].forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
  const frei = cfg.mode==="frei";
  $("opts").classList.toggle("hide", frei);
  $("reveal").classList.toggle("hide", !frei);
  $("answerBox").classList.add("hide");
  $("rate").classList.add("hide");
  $("hintBtn").classList.toggle("hide", !q.h);
  $("hintText").classList.add("hide"); $("hintText").textContent=q.h||"";
  $("verdict").classList.add("hide");
  $("next").classList.add("hide");
  $("next").textContent = idx===round.length-1 ? "Auswerten" : "Weiter";
  paintFlag();
}
$("hintBtn").onclick=()=>{ $("hintText").classList.remove("hide"); $("hintBtn").classList.add("hide"); };

function answer(pick){
  if(answered) return; answered=true;
  const cur=round[idx], q=cur.q, ok=pick===q.a;
  results[idx]=ok;
  const s=stats[q.id]||{r:0,w:0}; ok?s.r++:s.w++; stats[q.id]=s;
  recent=[q.id].concat(recent.filter(x=>x!==q.id)).slice(0,14);
  save();
  if(!ok) missed.push(q);
  [...$("opts").children].forEach(b=>{
    const i=parseInt(b.dataset.i,10); b.disabled=true;
    if(i===q.a) b.classList.add("pick-ok");
    else if(i===pick) b.classList.add("pick-bad");
    else b.classList.add("dim");
  });
  $("bar").children[idx].className = ok?"ok":"bad";
  $("hintBtn").classList.add("hide");
  const v=$("verdict"); v.className="verdict "+(ok?"win":"lose");
  $("vhead").textContent = ok ? "Richtig" : "Richtig wäre: "+q.o[q.a];
  $("vbody").textContent = q.e;
  $("next").classList.remove("hide");
  $("next").focus({preventScroll:true});
}
$("next").onclick=()=>{ if(idx<round.length-1){ idx++; render(); } else finish(); };

$("reveal").onclick=()=>{
  if(answered) return;
  const q=round[idx].q;
  $("reveal").classList.add("hide");
  $("hintBtn").classList.add("hide");
  $("answerText").textContent=q.o[q.a];
  $("answerBox").classList.remove("hide");
  const v=$("verdict"); v.className="verdict";
  $("vhead").textContent="Erl\u00e4uterung";
  $("vbody").textContent=q.e;
  $("rate").classList.remove("hide");
};

$("rate").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||answered) return;
  answered=true;
  const r=parseInt(b.dataset.r,10), q=round[idx].q, ok=r===2;
  results[idx] = r===2 ? true : r===1 ? "half" : false;
  const st=stats[q.id]||{r:0,w:0}; ok?st.r++:st.w++; stats[q.id]=st;
  recent=[q.id].concat(recent.filter(x=>x!==q.id)).slice(0,14);
  save();
  if(!ok) missed.push(q);
  $("bar").children[idx].className = r===2?"ok":r===1?"half":"bad";
  $("rate").classList.add("hide");
  if(idx<round.length-1){ idx++; render(); } else finish();
});

document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide")) return;
  if(cfg.mode==="frei"){
    const offen = !$("rate").classList.contains("hide");
    if(!offen && !answered && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); $("reveal").click(); }
    else if(offen && ["1","2","3"].includes(e.key)){ $("rate").children[parseInt(e.key,10)-1].click(); }
    return;
  }
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const b=$("opts").children[parseInt(e.key,10)-1]; if(b) b.click();
  } else if(answered && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); $("next").click(); }
});

function paintFlag(){
  const id=round[idx].q.id, on=!!flags[id];
  $("flagBtn").textContent = on ? "Markierung aufheben" : "Frage markieren";
  $("flagBtn").classList.toggle("on", on);
  $("flagBox").classList.add("hide");
  $("flagNote").value="";
  [...$("flagReason").children].forEach((c,i)=>c.setAttribute("aria-pressed", String(i===0)));
}
$("flagReason").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...$("flagReason").children].forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
});
$("flagBtn").onclick=()=>{
  const id=round[idx].q.id;
  if(flags[id]){ delete flags[id]; save(); paintFlag(); return; }
  $("flagBox").classList.toggle("hide");
};
$("flagSave").onclick=()=>{
  const q=round[idx].q;
  const r=[...$("flagReason").children].find(c=>c.getAttribute("aria-pressed")==="true");
  flags[q.id]={reason:(r?r.dataset.v:"Antwort fragw\u00fcrdig"), note:$("flagNote").value.trim(), q:q.q, a:q.o[q.a]};
  save(); paintFlag();
};

function renderFlags(){
  const ids=Object.keys(flags);
  $("flagsLede").textContent = ids.length===1 ? "Eine Frage wartet auf \u00dcberarbeitung." : ids.length+" Fragen warten auf \u00dcberarbeitung.";
  $("flagList").innerHTML = ids.map(id=>{
    const f=flags[id];
    return '<div class="flagitem"><p class="fid">'+id+'</p><p class="fq">'+f.q+'</p>'+
      '<p class="fr">'+f.reason+(f.note? " \u2013 "+f.note : "")+'</p>'+
      '<button data-id="'+id+'">Markierung entfernen</button></div>';
  }).join("");
  [...$("flagList").querySelectorAll("button")].forEach(b=>b.onclick=()=>{
    delete flags[b.dataset.id]; save(); renderFlags(); info();
    if(!Object.keys(flags).length) show("start");
  });
  $("flagText").classList.add("hide");
}
$("openFlags").onclick=()=>{ renderFlags(); show("flags"); };
$("flagsBack").onclick=()=>{ info(); show("start"); };
$("flagCopy").onclick=()=>{
  const ids=Object.keys(flags);
  const txt="Markierte Fragen im Solution Trainer ("+ids.length+")\n\n"+ids.map(id=>{
    const f=flags[id];
    return "["+id+"] "+f.q+"\nRichtige Antwort laut App: "+f.a+"\nGrund: "+f.reason+(f.note? "\nNotiz: "+f.note : "");
  }).join("\n\n");
  $("flagText").value=txt;
  $("flagText").classList.remove("hide");
  try{ navigator.clipboard.writeText(txt); }catch(e){}
  $("flagText").select();
};

function finish(){
  const right=results.filter(r=>r===true).length;
  const half=results.filter(r=>r==="half").length;
  $("score").textContent=right+" / "+round.length;
  const pct=right/round.length;
  let note = pct===1 ? "Alles sitzt." : pct>=0.7 ? "Solide, die L\u00fccken stehen unten." : "Da ist noch Luft, die Punkte unten lohnen sich.";
  if(half) note += " " + half + (half===1 ? " Frage war teilweise da." : " Fragen waren teilweise da.");
  $("scoreNote").textContent = note;
  $("redo").classList.toggle("hide", missed.length===0);
  $("missBox").classList.toggle("hide", missed.length===0);
  $("missList").innerHTML = missed.map(q=>
    '<article><p class="mq">'+q.q+'</p><p class="ma">'+q.o[q.a]+'</p></article>').join("");
  info(); show("end");
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
