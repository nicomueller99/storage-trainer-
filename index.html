 e:"Hunderte Desktops aus demselben Image teilen fast ihren gesamten Inhalt. Dasselbe gilt für Backups, bei denen sich zwischen zwei Vollsicherungen nur ein kleiner Teil ändert."},
{id:"d11",lvl:"tief",t:"ded",q:"Was bedeutet „effektive Kapazität\" in einem Datenblatt?",
 o:["Die nutzbare Kapazität nach RAID","Die nutzbare Kapazität multipliziert mit einer angenommenen Reduktionsrate","Die Rohkapazität aller Laufwerke","Die Kapazität nach Abzug der Snapshots"],a:1,
 e:"Der Wert enthält eine Annahme über die Daten des Kunden – und die muss nicht zutreffen. In Angeboten gehört immer dazu, welche Rate unterstellt wurde."},
{id:"d12",lvl:"tief",t:"ded",q:"Warum wird nach dem Löschen großer Datenmengen nicht sofort Platz frei?",
 o:["Weil die Daten erst nach 24 Stunden gelöscht werden","Weil Garbage Collection beziehungsweise Space Reclamation im Hintergrund läuft","Weil gelöschte Daten immer in einen Papierkorb wandern","Weil RAID den Platz reserviert"],a:1,
 e:"Freigegebene Blöcke müssen erst eingesammelt und zurück in den Pool gegeben werden. Bei knappem Füllstand ist das ein Punkt, den man dem Kunden vorher erklärt haben sollte."},
{id:"d13",lvl:"tief",t:"ded",q:"Wofür sind UNMAP beziehungsweise TRIM da?",
 o:["Zum Löschen defekter Blöcke","Damit der Host dem Array meldet, welche Blöcke wieder frei sind","Zum Prüfen der Datenintegrität","Zum Verteilen der Last auf mehrere Pfade"],a:1,
 e:"Ohne diese Rückmeldung hält das Array einmal beschriebene Blöcke für belegt. Thin-Volumes wachsen dann immer weiter, obwohl im Dateisystem längst gelöscht wurde."},
{id:"d14",lvl:"tief",t:"ded",q:"Was bedeutet Rehydrierung?",
 o:["Das Wiederherstellen gelöschter Daten","Das Zusammensetzen deduplizierter Daten beim Lesen","Das Neuaufbauen eines RAID-Verbunds","Das Entschlüsseln beim Zugriff"],a:1,
 e:"Was stark dedupliziert geschrieben wurde, muss beim Lesen aus vielen verstreuten Fragmenten zusammengeführt werden. Bei Restores aus Dedup-Appliances ist das der häufigste Grund für enttäuschende Rückspielzeiten."},
{id:"d15",lvl:"tief",t:"ded",q:"Was unterscheidet globale von lokaler Deduplizierung?",
 o:["Global arbeitet über den gesamten Pool, lokal nur innerhalb eines Volumes oder Jobs","Global arbeitet nur in der Cloud","Lokal ist immer effizienter","Global funktioniert nur mit Komprimierung"],a:0,
 e:"Je größer der Betrachtungsbereich, desto mehr Dubletten werden gefunden. Bei Vergleichen zwischen Herstellern ist das einer der Gründe für stark abweichende Raten."},
{id:"d16",lvl:"tief",t:"ded",q:"Warum ersetzt Komprimierung keine Deduplizierung?",
 o:["Weil Komprimierung zu langsam ist","Weil Komprimierung innerhalb eines Blocks arbeitet und identische Inhalte an anderer Stelle nicht erkennt","Weil Komprimierung nur bei Textdaten funktioniert","Weil Komprimierung verlustbehaftet ist"],a:1,
 e:"Zwanzig identische VMs komprimieren sich zwanzigmal einzeln. Erst die Deduplizierung erkennt, dass es derselbe Inhalt ist – deshalb setzen Arrays beides hintereinander ein."},
{id:"d17",lvl:"tief",t:"ded",q:"Was ist Zero-Block-Erkennung?",
 o:["Das Erkennen defekter Blöcke","Blöcke, die nur aus Nullen bestehen, werden nicht geschrieben, sondern nur vermerkt","Das Überspringen leerer Dateien","Eine Prüfsumme über jeden Block"],a:1,
 e:"Frisch angelegte, thick provisionierte Volumes bestehen zum großen Teil aus Nullen. Das treibt ausgewiesene Reduktionsraten nach oben, ohne dass echte Nutzdaten reduziert wurden."},
{id:"d18",lvl:"tief",t:"ded",q:"Zwei Hersteller nennen 4:1 und 5:1. Was prüfst du, bevor du das vergleichst?",
 o:["Nur den Preis pro TB","Worauf sich die Rate bezieht – ob Thin Provisioning, Snapshots, Klone und Nullblöcke eingerechnet sind, und für welchen Datentyp","Nur die Controller-Leistung","Nur die Laufwerksgröße"],a:1,
 e:"Manche Hersteller rechnen Thin Provisioning und Klone mit, andere weisen nur echte Deduplizierung und Komprimierung aus. Ohne gleiche Bezugsbasis vergleichst du zwei verschiedene Größen."},

{id:"w01",lvl:"basis",t:"virt",v:"vmw",q:"Was ist ESXi?",
 o:["Die Verwaltungsoberfläche von VMware","Der Hypervisor selbst, der direkt auf der Hardware läuft","Ein Dateisystem für virtuelle Maschinen","Ein Backup-Agent"],a:1,
 e:"ESXi ist ein Typ-1-Hypervisor: Er läuft unmittelbar auf dem Server, ohne darunterliegendes Betriebssystem. Die Verwaltung mehrerer Hosts übernimmt vCenter."},
{id:"w02",lvl:"basis",t:"virt",v:"vmw",q:"Wofür wird vCenter gebraucht?",
 o:["Zum Starten einzelner VMs","Zur zentralen Verwaltung mehrerer ESXi-Hosts – ohne vCenter gibt es kein vMotion, DRS oder HA","Als Speicherort für die VMs","Zur Lizenzierung der Gastbetriebssysteme"],a:1,
 e:"Ein einzelner ESXi-Host läuft auch ohne vCenter. Alle Cluster-Funktionen hängen aber daran, weshalb vCenter in jeder Angebotskalkulation auftauchen muss."},
{id:"w03",lvl:"basis",t:"virt",q:"Was unterscheidet einen Typ-1- von einem Typ-2-Hypervisor?",
 o:["Typ 1 läuft direkt auf der Hardware, Typ 2 auf einem bestehenden Betriebssystem","Typ 1 ist kostenpflichtig, Typ 2 kostenlos","Typ 1 kann nur Linux virtualisieren","Typ 2 ist schneller"],a:0,
 e:"ESXi, AHV und Hyper-V sind Typ 1 und für den Rechenzentrumsbetrieb gedacht. VirtualBox oder VMware Workstation sind Typ 2 und laufen als Anwendung auf einem Desktop."},
{id:"w04",lvl:"basis",t:"virt",v:"vmw",q:"Was ist VMFS?",
 o:["Ein Protokoll zur Speicheranbindung","Das Clusterdateisystem von VMware auf Blockspeicher, auf das mehrere Hosts gleichzeitig zugreifen","Ein Verfahren zur Datenreduktion","Das Dateiformat einer virtuellen Festplatte"],a:1,
 e:"VMFS regelt über verteilte Sperren, dass mehrere ESXi-Hosts dieselbe LUN gleichzeitig nutzen können. Bei NFS-Datastores entfällt es, dort bringt das Storage das Dateisystem mit."},
{id:"w05",lvl:"basis",t:"virt",v:"vmw",q:"Was macht vMotion?",
 o:["Es sichert eine VM auf ein zweites System","Es verschiebt eine laufende VM ohne Unterbrechung auf einen anderen Host","Es startet eine VM nach einem Ausfall neu","Es kopiert eine VM in die Cloud"],a:1,
 e:"Der Arbeitsspeicher wird im laufenden Betrieb übertragen, der Umschaltmoment liegt im Millisekundenbereich. Voraussetzung ist gemeinsamer Speicher oder, bei vSphere, die Variante ohne Shared Storage."},
{id:"w06",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet vMotion von Storage vMotion?",
 o:["vMotion verschiebt den Rechenort, Storage vMotion den Speicherort der Dateien","Storage vMotion ist die ältere Bezeichnung","vMotion funktioniert nur im selben Rack","Es gibt keinen Unterschied"],a:0,
 e:"Mit vMotion wechselt die VM den Host, mit Storage vMotion wechseln ihre Dateien den Datastore. Letzteres ist das Werkzeug für Storage-Migrationen im laufenden Betrieb."},
{id:"w07",lvl:"basis",t:"virt",v:"vmw",q:"Was macht vSphere HA bei einem Hostausfall?",
 o:["Es führt die VMs unterbrechungsfrei weiter","Es startet die betroffenen VMs auf anderen Hosts neu","Es verschiebt die VMs vorab","Es erstellt ein Backup"],a:1,
 e:"HA bedeutet Neustart, nicht unterbrechungsfreien Betrieb. Die VMs sind also kurz weg – ein Punkt, den Kunden regelmäßig anders erwarten, als er tatsächlich funktioniert."},
{id:"w08",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet Fault Tolerance von HA?",
 o:["FT ist die günstigere Variante","FT führt eine synchrone Schattenkopie der VM mit und überbrückt den Ausfall ohne Neustart","FT ersetzt das Backup","FT funktioniert nur mit NFS"],a:1,
 e:"FT läuft wirklich unterbrechungsfrei, kostet aber doppelte Ressourcen und ist bei der Anzahl der vCPUs stark begrenzt. Es ist eine Ausnahmelösung für einzelne kritische VMs, kein Clusterkonzept."},
{id:"w09",lvl:"tief",t:"virt",v:"vmw",q:"Was leistet DRS?",
 o:["Es sichert VMs automatisch","Es verteilt VMs anhand der Auslastung automatisch zwischen den Hosts","Es repliziert VMs in ein zweites Rechenzentrum","Es überwacht die Speicherbelegung"],a:1,
 e:"DRS nutzt vMotion, um Lastspitzen auszugleichen. Es setzt vCenter und gemeinsamen Speicher voraus und ist nicht in jeder Lizenzstufe enthalten."},
{id:"w10",lvl:"tief",t:"virt",q:"Warum ist ein VM-Snapshot kein Backup?",
 o:["Weil er zu lange dauert","Weil die Delta-Datei auf demselben Datastore liegt, mitwächst und bei dessen Verlust ebenfalls weg ist","Weil er keine Konsistenz herstellt","Weil er nur einmal pro VM möglich ist"],a:1,
 e:"Snapshots sind als kurzfristiger Rückfallpunkt gedacht, etwa vor einem Update. Lange laufende Snapshots kosten spürbar Leistung und werden beim Zusammenführen selbst zum Risiko."},
{id:"w11",lvl:"tief",t:"virt",v:"vmw",q:"Wofür steht CBT bei VMware?",
 o:["Cluster Backup Target","Changed Block Tracking – das Nachhalten geänderter Blöcke für inkrementelle Backups","Central Backup Transfer","Compressed Block Transfer"],a:1,
 e:"Ohne CBT müsste jedes Backup die komplette virtuelle Festplatte lesen. Backup-Produkte wie Veeam setzen darauf auf – fehlerhafte CBT-Daten sind eine klassische Ursache für zu große Inkremente."},
{id:"w12",lvl:"tief",t:"virt",v:"vmw",q:"Was ist VAAI?",
 o:["Ein Netzwerkprotokoll","Eine Schnittstelle, über die ESXi Speicheroperationen an das Array auslagert","Ein Lizenzmodell","Ein Verschlüsselungsverfahren"],a:1,
 e:"Kopieren oder Nullsetzen übernimmt das Array selbst, statt die Daten durch den Host zu schleifen. Ob ein Array die Primitive unterstützt, gehört in jede Storage-Bewertung für VMware-Umgebungen."},
{id:"w13",lvl:"tief",t:"virt",v:"vmw",q:"Was sind vVols?",
 o:["Besonders große LUNs","VM-granulare Objekte auf dem Array statt einer LUN mit VMFS darauf","Virtuelle Netzwerkadapter","Eine Snapshot-Technik des Hypervisors"],a:1,
 e:"Mit vVols kennt das Array die einzelne VM und kann Snapshots, Replikation und QoS je VM anwenden. Der Preis ist eine engere Abhängigkeit von der Array-Integration über VASA."},
{id:"w14",lvl:"tief",t:"virt",v:"vmw",q:"Was ist vSAN?",
 o:["Ein Protokoll für Speichernetze","Softwaredefinierter Speicher aus den lokalen Laufwerken der ESXi-Hosts","Ein externes Speichersystem von VMware","Ein Backup-Produkt"],a:1,
 e:"vSAN macht aus den Hosts selbst das Speichersystem, also hyperkonvergent. In den aktuellen Bundles ist eine Kapazität je lizenziertem Core enthalten, darüber hinaus wird nachlizenziert."},
{id:"w15",lvl:"tief",t:"virt",v:"vmw",q:"Wie verkauft Broadcom VMware heute?",
 o:["Als unbefristete Lizenz je Sockel","Als Abonnement je physischem Core, gebündelt in VVF oder VCF","Als Abonnement je virtueller Maschine","Als Abonnement je Cluster"],a:1,
 e:"Unbefristete Lizenzen gibt es nicht mehr, vSphere Standard und Enterprise Plus wurden in die Bündel überführt. Gezählt werden physische Kerne, nicht Sockel oder VMs."},
{id:"w16",lvl:"tief",t:"virt",v:"vmw",q:"Ein Server hat zwei Prozessoren mit je acht Kernen. Wie viele Cores sind bei VMware zu lizenzieren?",
 o:["16","32","8","24"],a:1,
 h:"Es gilt ein Mindestwert je Prozessor.",
 e:"Broadcom setzt mindestens 16 Kerne je Prozessor an, auch wenn physisch weniger verbaut sind. Zwei Prozessoren ergeben also 32 Cores – bei kleinen CPUs ein erheblicher Kostentreiber, der in die Serverauswahl gehört."},
{id:"w17",lvl:"tief",t:"virt",v:"vmw",q:"Worin unterscheiden sich VVF und VCF?",
 o:["VVF ist die Cloud-Variante","VCF enthält zusätzlich NSX, Automatisierung und deutlich mehr vSAN-Kapazität je Core","VVF enthält kein vCenter","VCF ist nur für Edge-Umgebungen"],a:1,
 e:"VVF deckt Virtualisierung und Betrieb ab, VCF den kompletten Private-Cloud-Stack. Wer kein softwaredefiniertes Netzwerk braucht, zahlt bei VCF für Funktionen, die ungenutzt bleiben."},
{id:"w18",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet thin von thick provisionierten virtuellen Festplatten?",
 o:["Thin belegt Platz erst beim Schreiben, thick reserviert ihn sofort","Thick ist immer langsamer","Thin funktioniert nur auf NFS","Es betrifft nur die Snapshot-Fähigkeit"],a:0,
 e:"Thin spart Platz, erfordert aber Überwachung des Datastores. Gefährlich wird die Kombination aus thin auf Hypervisor-Ebene und thin auf Array-Ebene, wenn niemand den realen Füllstand im Blick hat."},
{id:"w19",lvl:"basis",t:"virt",v:"vmw",q:"Was ist ein Cluster Shared Volume (CSV) bei Hyper-V?",
 o:["Ein Volume, auf das mehrere Clusterknoten gleichzeitig zugreifen","Ein gespiegeltes Volume zwischen zwei Standorten","Ein Volume nur für Clusterkonfiguration","Ein Volume für Quorum-Daten"],a:0,
 e:"Das CSV ist bei Hyper-V das Gegenstück zum VMFS-Datastore: gemeinsamer Blockspeicher, auf dem die VMs mehrerer Knoten liegen. Dazu kommt als Alternative die Ablage auf einer SMB3-Freigabe."},
{id:"w20",lvl:"basis",t:"virt",v:"vmw",q:"Welches Dateiformat nutzen virtuelle Festplatten unter Hyper-V?",
 o:["VMDK","VHDX","QCOW2","VDI"],a:1,
 e:"VHDX ist der Nachfolger von VHD und bei Hyper-V Standard. VMDK ist das VMware-Format, QCOW2 stammt aus der KVM-Welt – bei Migrationen muss konvertiert werden."},
{id:"w21",lvl:"basis",t:"virt",v:"vmw",q:"Was ist AHV?",
 o:["Die Verwaltungsoberfläche von Nutanix","Nutanix' eigener Typ-1-Hypervisor auf KVM-Basis","Ein Speicherprotokoll von Nutanix","Ein Backup-Produkt"],a:1,
 e:"AHV ist in der Nutanix-Lizenz enthalten und verursacht keine separaten Hypervisor-Kosten. Genau das ist seit der Broadcom-Umstellung sein stärkstes Verkaufsargument."},
{id:"w22",lvl:"tief",t:"virt",v:"vmw",q:"Was ist die CVM bei Nutanix?",
 o:["Eine zentrale Verwaltungsinstanz für den gesamten Cluster","Eine Controller-VM auf jedem Knoten, die den gesamten Storage-I/O dieses Knotens übernimmt","Eine virtuelle Maschine für Clusterdienste im Standby","Der Name des Nutanix-Dateisystems"],a:1,
 e:"Jeder Knoten ist damit sein eigener Speichercontroller, einen zentralen Flaschenhals gibt es nicht. Die CVM braucht dafür fest zugewiesene CPU und RAM – das muss bei der Dimensionierung abgezogen werden."},
{id:"w23",lvl:"tief",t:"virt",v:"vmw",q:"Was bedeutet Datenlokalität bei Nutanix?",
 o:["Daten dürfen das Rechenzentrum nicht verlassen","Die Daten einer VM liegen bevorzugt auf dem Knoten, auf dem sie läuft","Alle Daten liegen auf einem zentralen Knoten","Daten werden nach Standort verschlüsselt"],a:1,
 e:"Lesezugriffe bleiben dadurch lokal und sparen den Weg über das Netz. Nach einer Migration zieht Nutanix die Daten nach, bis die Lokalität wiederhergestellt ist."},
{id:"w24",lvl:"tief",t:"virt",v:"vmw",q:"Was unterscheidet Prism Element von Prism Central?",
 o:["Prism Element verwaltet einen Cluster, Prism Central mehrere","Prism Central ist die ältere Version","Prism Element läuft nur mit ESXi","Prism Central ist nur für Backups"],a:0,
 e:"Prism Element ist auf jedem Cluster vorhanden. Prism Central kommt als eigene VM hinzu und ist Voraussetzung für übergreifende Funktionen – das wird bei Konfigurationen gern vergessen."},
{id:"w25",lvl:"tief",t:"virt",v:"vmw",q:"Was bedeutet RF2 beziehungsweise RF3 bei Nutanix?",
 o:["Die Anzahl der Netzwerkpfade","Der Replikationsfaktor: zwei beziehungsweise drei Kopien jedes Datenblocks im Cluster","Die Anzahl der Controller je Knoten","Die RAID-Stufe der lokalen Laufwerke"],a:1,
 e:"RF2 verkraftet den Ausfall eines Knotens, RF3 den von zweien – kostet dafür aber ein Drittel statt der Hälfte der Rohkapazität zusätzlich. RF3 verlangt zudem eine Mindestanzahl Knoten."},
{id:"w26",lvl:"basis",t:"virt",q:"Was kennzeichnet eine hyperkonvergente Infrastruktur (HCI)?",
 o:["Compute und Storage stecken in denselben Knoten, ein externes SAN entfällt","Server und Storage kommen vom selben Hersteller","Alle Komponenten liegen in einem Rack","Die Virtualisierung läuft in der Cloud"],a:0,
 e:"Die lokalen Laufwerke aller Knoten bilden per Software einen gemeinsamen Speicher. Erweitert wird knotenweise, wodurch Rechenleistung und Kapazität immer zusammen wachsen – der zentrale Nachteil gegenüber disaggregierten Systemen."},
{id:"w27",lvl:"tief",t:"virt",q:"Was bedeutet Overcommitment?",
 o:["Die Zusage zu hoher Verfügbarkeit","Es sind mehr virtuelle Ressourcen zugewiesen, als physisch vorhanden sind","Die Überbuchung des Speicherplatzes im Datastore","Der Betrieb über der zulässigen Temperatur"],a:1,
 e:"Bei CPU ist das üblich und unkritisch, solange nicht alle VMs gleichzeitig Last erzeugen. Bei Arbeitsspeicher wird es schnell gefährlich, weil der Hypervisor dann auf Auslagerung ausweichen muss."},
{id:"w28",lvl:"tief",t:"virt",q:"Was sagt eine hohe CPU Ready Time aus?",
 o:["Die VM ist schnell gestartet","Die VM wartet auf freie physische Kerne – ein Hinweis auf CPU-Überbuchung","Der Prozessor läuft zu heiß","Die VM hat zu wenig Arbeitsspeicher"],a:1,
 e:"Die VM ist bereit, bekommt aber keine Rechenzeit zugeteilt. Das ist der verlässlichste Indikator dafür, dass ein Host überbucht ist – und oft der eigentliche Grund hinter Beschwerden über Langsamkeit."},
{id:"w29",lvl:"tief",t:"virt",q:"Warum macht das Zuweisen weiterer vCPUs eine VM nicht zwangsläufig schneller?",
 o:["Weil der Hypervisor vCPUs ignoriert","Weil breite VMs länger auf gleichzeitig freie Kerne warten müssen","Weil die Lizenz das begrenzt","Weil vCPUs nur beim Start zählen"],a:1,
 e:"Der Scheduler muss für eine VM mit acht vCPUs genügend Kerne gleichzeitig bereitstellen. Auf einem ausgelasteten Host wartet diese VM länger als eine mit zwei vCPUs – mehr zuweisen verschlimmert das Problem oft."},
{id:"w30",lvl:"tief",t:"virt",v:"vmw",q:"Ein Kunde will wegen der VMware-Kosten wechseln und hat drei Hosts mit externem Storage. Worauf weist du bei Nutanix hin?",
 o:["Nutanix läuft auf jeder vorhandenen Hardware weiter","Nutanix ist hyperkonvergent – das vorhandene Array wird in der Regel nicht weitergenutzt, die Knoten bringen den Speicher mit","Nutanix benötigt zwingend ein FC-SAN","Der Wechsel ist ohne Migration der VMs möglich"],a:1,
 e:"Der Kostenvergleich muss deshalb die Abschreibung des vorhandenen Storage und die Migration enthalten, nicht nur die Lizenzen. Umgekehrt entfällt bei AHV der separate Hypervisor-Posten – beides gehört in dieselbe Rechnung."}
,
{id:"g01",lvl:"basis",t:"virt",q:"Was macht ein Hypervisor?",
 o:["Er beschleunigt den Server durch Zwischenspeicher","Er teilt die physischen Ressourcen eines Servers auf mehrere voneinander getrennte virtuelle Maschinen auf","Er verbindet mehrere Server zu einem großen System","Er verwaltet die Datensicherung"],a:1,
 e:"Der Hypervisor sitzt zwischen Hardware und den virtuellen Maschinen und teilt CPU, Arbeitsspeicher, Netz und Speicher zu. Die VMs sind dabei gegeneinander abgeschottet."},
{id:"g02",lvl:"basis",t:"virt",q:"Was ist eine virtuelle Maschine technisch gesehen?",
 o:["Ein Prozess im Betriebssystem des Hosts","Ein vollständiges Betriebssystem mit eigenen virtuellen Komponenten, das als Satz von Dateien auf dem Speicher liegt","Eine Kopie des Host-Betriebssystems","Ein Container mit einer Anwendung"],a:1,
 e:"Weil eine VM aus Dateien besteht, lässt sie sich kopieren, verschieben und sichern wie Daten. Genau das ist der eigentliche Gewinn der Virtualisierung gegenüber physischen Servern."},
{id:"g03",lvl:"tief",t:"virt",q:"Was ist eine vCPU?",
 o:["Ein fest zugewiesener physischer Kern","Ein virtueller Kern, den der Scheduler auf freie physische Kerne verteilt","Ein halber physischer Kern","Ein Kern im Reservezustand"],a:1,
 e:"Es gibt keine feste Zuordnung. Mehrere VMs teilen sich dieselben physischen Kerne, was Überbuchung erst möglich macht – und bei zu hoher Last zu Wartezeiten führt."},
{id:"g04",lvl:"tief",t:"virt",q:"Wozu dienen die Gast-Erweiterungen beziehungsweise paravirtualisierten Treiber?",
 o:["Zur Lizenzierung des Gastbetriebssystems","Sie ersetzen emulierte Geräte durch optimierte Treiber für Netz und Speicher","Sie verschlüsseln die VM","Sie erzeugen Snapshots"],a:1,
 e:"Ohne sie spricht die VM mit nachgebildeter Standardhardware, was spürbar Leistung kostet. Fehlende oder veraltete Gast-Erweiterungen sind eine der häufigsten Ursachen für unerklärlich langsame VMs."},
{id:"g05",lvl:"basis",t:"virt",q:"Was ist Live-Migration?",
 o:["Das Kopieren einer VM auf ein Sicherungssystem","Das Verschieben einer laufenden VM auf einen anderen Host ohne Abschaltung","Der Neustart einer VM nach einem Hostausfall","Das Umziehen einer VM in die Cloud"],a:1,
 e:"Der Arbeitsspeicher wird im Betrieb übertragen, der eigentliche Umschaltmoment ist sehr kurz. Das ist die Grundlage für Wartung ohne Ausfallzeit."},
{id:"g06",lvl:"tief",t:"virt",q:"Welche Voraussetzungen hat Live-Migration typischerweise?",
 o:["Identische Hardware auf allen Hosts","Erreichbarer gemeinsamer Speicher, kompatible Prozessoren und ausreichend Netzbandbreite","Ein zweites Rechenzentrum","Abgeschaltete Snapshots"],a:1,
 e:"Varianten ohne gemeinsamen Speicher gibt es inzwischen, sie übertragen dann zusätzlich die Festplattendaten. Die Prozessorkompatibilität bleibt aber in jedem Fall eine Bedingung."},
{id:"g07",lvl:"tief",t:"virt",q:"Warum müssen Prozessoren in einem Virtualisierungscluster zueinander passen?",
 o:["Wegen der Lizenzierung","Weil eine laufende VM den Befehlssatz ihrer CPU sieht und bei ungleichen Generationen nicht migriert werden kann","Weil sonst der Takt sinkt","Weil der Hypervisor nur einen CPU-Typ unterstützt"],a:1,
 e:"Hypervisor lösen das, indem sie clusterweit einen gemeinsamen Befehlssatz erzwingen und neuere Funktionen ausblenden. Beim Mischen von Servergenerationen gehört dieser Punkt vorab geprüft."},
{id:"g08",lvl:"basis",t:"virt",q:"Was ist ein Virtualisierungscluster?",
 o:["Ein Server mit besonders vielen VMs","Mehrere Hosts, die als Verbund VMs tragen und sich bei Ausfall gegenseitig vertreten","Ein Verbund mehrerer Speichersysteme","Mehrere VMs mit derselben Aufgabe"],a:1,
 e:"Der Verbund braucht gemeinsamen Speicher oder verteilten Speicher, eine Verwaltungsinstanz und ein Verfahren zur Mehrheitsfindung. Erst dann lassen sich Ausfälle automatisch abfangen."},
{id:"g09",lvl:"tief",t:"virt",q:"Was unterscheidet Hochverfügbarkeit von Lastverteilung im Cluster?",
 o:["Nichts, beide Begriffe meinen dasselbe","Hochverfügbarkeit reagiert auf Ausfälle, Lastverteilung auf ungleiche Auslastung","Lastverteilung läuft nur manuell","Hochverfügbarkeit gibt es nur mit drei Knoten"],a:1,
 e:"Das eine startet VMs nach einem Hostausfall neu, das andere verschiebt sie im Normalbetrieb dorthin, wo Luft ist. Beides sind getrennte Funktionen und oft auch getrennt lizenziert."},
{id:"g10",lvl:"basis",t:"virt",q:"Was ist ein Datenspeicher (Datastore) in der Virtualisierung?",
 o:["Der Arbeitsspeicher der VMs","Der Speicherbereich, in dem die Dateien der virtuellen Maschinen liegen","Die Datenbank der Verwaltungssoftware","Ein Sicherungsziel"],a:1,
 e:"Je nach Anbindung liegt darunter eine LUN mit Clusterdateisystem oder eine Dateifreigabe. Für den Betrieb ist vor allem der Füllstand kritisch – ein volllaufender Datenspeicher legt alle VMs darauf still."},
{id:"g11",lvl:"tief",t:"virt",q:"Welches Risiko entsteht, wenn sowohl der Hypervisor als auch das Array dünn provisionieren?",
 o:["Die Leistung halbiert sich","Doppelte Überbuchung – niemand sieht den realen Füllstand, bis der Pool volläuft","Snapshots funktionieren nicht mehr","Die Kapazität wird doppelt berechnet"],a:1,
 e:"Beide Ebenen melden freien Platz, den es physisch nicht gibt. Entweder man provisioniert nur auf einer Ebene dünn, oder die Überwachung muss beide Ebenen zusammen betrachten."},
{id:"g12",lvl:"tief",t:"virt",q:"Was ist Memory Ballooning?",
 o:["Das Vergrößern des Arbeitsspeichers im laufenden Betrieb","Der Hypervisor fordert über einen Treiber im Gast ungenutzten Speicher zurück, bevor er auslagern muss","Das Auslagern von Speicher auf die Festplatte","Eine Komprimierung des Arbeitsspeichers"],a:1,
 e:"Der Gast gibt freiwillig her, was er nicht braucht – das ist der schonendste Weg bei Speicherknappheit. Voraussetzung ist der Ballooning-Treiber aus den Gast-Erweiterungen."},
{id:"g13",lvl:"tief",t:"virt",q:"Was passiert bei Überbuchung des Arbeitsspeichers, wenn physisch nichts mehr frei ist?",
 o:["Die VMs werden pausiert","Der Hypervisor lagert Speicherinhalte auf den Datenspeicher aus, die Leistung bricht massiv ein","Neue VMs lassen sich nicht mehr starten, laufende bleiben unberührt","Der Host startet neu"],a:1,
 e:"Auslagerung bedeutet, dass Arbeitsspeicherzugriffe plötzlich über das Speichersystem laufen. Deshalb ist Überbuchung bei CPU alltäglich, bei Arbeitsspeicher dagegen mit Vorsicht zu planen."},
{id:"g14",lvl:"tief",t:"virt",q:"Wie funktioniert ein Snapshot technisch?",
 o:["Es wird eine vollständige Kopie der VM angelegt","Der bisherige Stand wird eingefroren, alle Änderungen landen in einer wachsenden Delta-Datei","Die VM wird kurz angehalten und gesichert","Es werden nur die Metadaten gesichert"],a:1,
 e:"Deshalb kostet ein Snapshot zunächst kaum Platz, wächst aber mit jeder Änderung. Und deshalb dauert das Zusammenführen nach Tagen oder Wochen entsprechend lange."},
{id:"g15",lvl:"tief",t:"virt",q:"Warum reicht ein Snapshot für ein anwendungskonsistentes Backup nicht aus?",
 o:["Weil er zu langsam ist","Weil die Anwendung ihre Puffer erst schreiben muss – ohne dieses Stillstellen ist nur der Dateizustand konsistent","Weil Snapshots keine Datenbanken erfassen","Weil Snapshots nicht übertragbar sind"],a:1,
 e:"Unter Windows übernimmt das der Schattenkopiedienst, bei Datenbanken gibt es eigene Verfahren. Ohne diesen Schritt bekommt man den Zustand eines abrupten Stromausfalls – oft wiederherstellbar, aber nicht garantiert."},
{id:"g16",lvl:"tief",t:"virt",q:"Was unterscheidet einen Container von einer virtuellen Maschine?",
 o:["Container sind kleinere VMs","Container teilen sich den Kernel des Hosts, VMs bringen ein eigenes Betriebssystem mit","Container laufen nur in der Cloud","Container brauchen keinen Speicher"],a:1,
 e:"Der geteilte Kernel macht Container schlank und schnell startbar, die Abschottung ist dafür schwächer als bei einer VM. In der Praxis laufen Container heute meist innerhalb von VMs."},
{id:"g17",lvl:"tief",t:"virt",q:"Was sind Affinitäts- und Anti-Affinitätsregeln?",
 o:["Regeln für die Zugriffsrechte auf VMs","Regeln, die VMs gezielt zusammen oder bewusst getrennt auf Hosts halten","Regeln für die Reihenfolge beim Start","Regeln zur Speicherzuweisung"],a:1,
 e:"Zwei Knoten eines Datenbankclusters auf demselben Host heben die Redundanz auf. Anti-Affinität verhindert genau das – ohne solche Regeln verschiebt die automatische Lastverteilung sie irgendwann zusammen."},
{id:"g18",lvl:"tief",t:"virt",q:"Was ist beim Durchreichen einer GPU an eine VM zu beachten?",
 o:["Die GPU lässt sich auf beliebig viele VMs aufteilen","Die VM ist danach in der Regel nicht mehr live migrierbar","Es wird keine zusätzliche Lizenz benötigt","Der Host verliert den Zugriff auf alle PCIe-Geräte"],a:1,
 e:"Beim exklusiven Durchreichen hängt die VM an genau dieser physischen Karte. Für Wartung ohne Ausfallzeit braucht es stattdessen geteilte Verfahren, die wiederum eigene Lizenzen verlangen."},
{id:"g19",lvl:"basis",t:"virt",q:"Was bewirkt der Wartungsmodus eines Hosts?",
 o:["Der Host wird abgeschaltet","Der Host wird leergeräumt – die VMs ziehen vorher auf andere Hosts um","Alle VMs auf dem Host werden angehalten","Der Host nimmt nur noch neue VMs an"],a:1,
 e:"So lässt sich Firmware oder Hypervisor aktualisieren, ohne dass VMs ausfallen. Voraussetzung ist genug freie Kapazität auf den übrigen Hosts – das ist der eigentliche Grund für die N+1-Auslegung im Cluster."},
{id:"g20",lvl:"tief",t:"virt",q:"Wofür stehen Intel VT-x beziehungsweise AMD-V?",
 o:["Übertaktungsfunktionen","Hardwareunterstützung für Virtualisierung im Prozessor","Verschlüsselungsbefehle","Energiesparmodi"],a:1,
 e:"Ohne diese Erweiterungen müsste der Hypervisor die Befehle aufwendig nachbilden. Sie sind heute überall vorhanden, können im BIOS aber deaktiviert sein – ein klassischer Stolperstein bei der Erstinstallation."},
{id:"g21",lvl:"tief",t:"virt",q:"Was ist ein Template beziehungsweise Golden Image?",
 o:["Eine Sicherungskopie einer VM","Eine vorbereitete Vorlage, aus der neue VMs erzeugt werden","Die Grundkonfiguration des Hypervisors","Ein Snapshot vor einem Update"],a:1,
 e:"Einmal gepflegt, startet jede neue VM mit demselben Stand an Betriebssystem, Treibern und Grundeinstellungen. Bei VDI ist das zugleich die Grundlage für hohe Deduplizierungsraten."},

{id:"c18",lvl:"basis",t:"srv",q:"Was ist ein BMC?",
 o:["Ein Verwaltungsprozessor auf dem Mainboard für Fernzugriff unabhängig vom Betriebssystem","Ein Baustein zur Speicherverwaltung","Ein Controller für die Laufwerke","Ein Modul zur Stromversorgung"],a:0,
 e:"Der Baseboard Management Controller arbeitet auch bei ausgeschaltetem Betriebssystem. Jeder Hersteller hat dafür einen eigenen Namen und eigene Lizenzstufen – die Funktion ist im Kern dieselbe."},
{id:"c19",lvl:"basis",t:"srv",q:"Wann ist ein Tower-Server gegenüber einem Rack-Server sinnvoll?",
 o:["Bei besonders hoher Rechenleistung","Wenn kein Serverschrank vorhanden ist, etwa in Filialen oder kleinen Büros","Bei mehr als zwei Prozessoren","Wenn redundante Netzteile gefordert sind"],a:1,

const KEY="sp-trainer-v1";
let stats={}, recent=[], cfg={lvl:"basis", n:10, topics:["alle"], vend:"alle"};
try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); stats=p.stats||{}; recent=p.recent||[]; if(p.cfg) cfg=Object.assign(cfg,p.cfg);} }catch(e){}
if(!Array.isArray(cfg.topics)) cfg.topics = cfg.topic ? [cfg.topic] : ["alle"];
delete cfg.topic;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({stats,recent,cfg})); }catch(e){} }

const $=id=>document.getElementById(id);
let round=[], idx=0, answered=false, missed=[], results=[];

const GROUPS={"@storage":["proto","kap","ded"]};
function topicOf(q){ return q.t || "proto"; }
function sel(){ return (Array.isArray(cfg.topics) && cfg.topics.length) ? cfg.topics : ["alle"]; }
function expand(t){
  const out=[];
  t.forEach(x=>{ (GROUPS[x]||[x]).forEach(y=>{ if(out.indexOf(y)<0) out.push(y); }); });
  return out;
}
function vendOk(q){
  if(cfg.vend==="neutral") return !q.v;
  if(cfg.vend==="only") return !!q.v;
  return true;
}
function pool(){
  const t=expand(sel()), all=t.indexOf("alle")>-1;
  return POOL.filter(q =>
    (cfg.lvl==="alle" || q.lvl==="basis") &&
    (all || t.indexOf(topicOf(q))>-1) && vendOk(q));
}
function weight(q){
  const s=stats[q.id]||{r:0,w:0};
  let v=1 + 3*s.w - 0.6*s.r;
  if(!s.r && !s.w) v+=2;
  const pos=recent.indexOf(q.id);
  if(pos>-1) v*= 0.25 + 0.05*pos;
  return Math.max(0.3,v);
}
function draw(n){
  const src=pool().slice(), out=[];
  n=Math.min(n,src.length);
  while(out.length<n){
    const tot=src.reduce((a,q)=>a+weight(q),0);
    let r=Math.random()*tot, i=0;
    for(;i<src.length;i++){ r-=weight(src[i]); if(r<=0) break; }
    out.push(src.splice(Math.min(i,src.length-1),1)[0]);
  }
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function segInit(el,key,cast){
  el.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    [...el.children].forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
    cfg[key]=cast(b.dataset.v); save(); info();
  });
  [...el.children].forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.v===String(cfg[key]))));
}
function paintTopics(){
  const t=sel(), e=expand(t);
  [...$("segTopic").children].forEach(c=>{
    const v=c.dataset.v;
    const on = GROUPS[v] ? GROUPS[v].every(x=>e.indexOf(x)>-1) : t.indexOf(v)>-1;
    c.setAttribute("aria-pressed", String(on));
  });
}
$("segTopic").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const v=b.dataset.v;
  let t=sel().slice();
  if(v==="alle"){ t=["alle"]; }
  else if(GROUPS[v]){
    t=t.filter(x=>x!=="alle");
    const e=expand(t), on=GROUPS[v].every(x=>e.indexOf(x)>-1);
    t=t.filter(x=>GROUPS[v].indexOf(x)<0 && x!==v);
    if(!on) t=t.concat(GROUPS[v]);
    if(!t.length) t=["alle"];
  }
  else{
    t=t.filter(x=>x!=="alle");
    t = t.indexOf(v)>-1 ? t.filter(x=>x!==v) : t.concat([v]);
    if(!t.length) t=["alle"];
  }
  cfg.topics=t; save(); paintTopics(); info();
});
paintTopics();
segInit($("segVend"),"vend",v=>v);
segInit($("segLevel"),"lvl",v=>v);
segInit($("segCount"),"n",v=>parseInt(v,10));

function info(){
  const p=pool();
  const seen=p.filter(q=>stats[q.id]&&(stats[q.id].r||stats[q.id].w)).length;
  const weak=p.filter(q=>stats[q.id]&&stats[q.id].w>stats[q.id].r).length;
  $("poolInfo").textContent = p.length+" Fragen im Pool · "+seen+" schon beantwortet"+(weak?" · "+weak+" noch wackelig":"");
  $("reset").classList.toggle("hide", seen===0);
}
info();

function show(s){ ["start","quiz","end"].forEach(x=>$(x).classList.toggle("hide", x!==s)); window.scrollTo(0,0); }

function start(list){
  round=list.map(q=>({q, opts:shuffle(q.o.map((t,i)=>({t,i})))}));
  idx=0; missed=[]; results=new Array(round.length).fill(null);
  show("quiz"); render();
}
$("go").onclick=()=>start(draw(cfg.n));
$("again").onclick=()=>start(draw(cfg.n));
$("home").onclick=()=>{ info(); show("start"); };
$("back").onclick=()=>{ info(); show("start"); };
$("redo").onclick=()=>start(missed.map(q=>q));
$("reset").onclick=()=>{ stats={}; recent=[]; save(); info(); };

function render(){
  answered=false;
  const cur=round[idx], q=cur.q;
  $("bar").innerHTML = round.map((_,i)=>{
    const r=results[i]; return '<i class="'+(r===true?"ok":r===false?"bad":i===idx?"now":"")+'"></i>';
  }).join("");
  $("pos").textContent="Frage "+(idx+1)+" von "+round.length;
  const tp=topicOf(q);
  const LBL={proto:"Storage & Protokolle", kap:"Kapazität & RAID", ded:"Datenreduktion", srv:"Compute", virt:"Virtualisierung", bak:"Backup & Hochverfügbarkeit", szen:"Konzeption"};
  $("tag").textContent = q.v==="hpe" ? "HPE" : q.v==="vmw" ? "VMware & Nutanix" : (LBL[tp] || "Grundlagen");
  $("qtext").textContent=q.q;
  const keys=["A","B","C","D"];
  $("opts").innerHTML = cur.opts.map((o,i)=>
    '<button class="opt" data-i="'+o.i+'"><span class="k">'+keys[i]+'</span><span>'+o.t+'</span></button>').join("");
  [...$("opts").children].forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
  $("hintBtn").classList.toggle("hide", !q.h);
  $("hintText").classList.add("hide"); $("hintText").textContent=q.h||"";
  $("verdict").classList.add("hide");
  $("next").classList.add("hide");
  $("next").textContent = idx===round.length-1 ? "Auswerten" : "Weiter";
}
$("hintBtn").onclick=()=>{ $("hintText").classList.remove("hide"); $("hintBtn").classList.add("hide"); };

function answer(pick){
  if(answered) return; answered=true;
  const cur=round[idx], q=cur.q, ok=pick===q.a;
  results[idx]=ok;
  const s=stats[q.id]||{r:0,w:0}; ok?s.r++:s.w++; stats[q.id]=s;
  recent=[q.id].concat(recent.filter(x=>x!==q.id)).slice(0,14);
  save();
  if(!ok) missed.push(q);
  [...$("opts").children].forEach(b=>{
    const i=parseInt(b.dataset.i,10); b.disabled=true;
    if(i===q.a) b.classList.add("pick-ok");
    else if(i===pick) b.classList.add("pick-bad");
    else b.classList.add("dim");
  });
  $("bar").children[idx].className = ok?"ok":"bad";
  $("hintBtn").classList.add("hide");
  const v=$("verdict"); v.className="verdict "+(ok?"win":"lose");
  $("vhead").textContent = ok ? "Richtig" : "Richtig wäre: "+q.o[q.a];
  $("vbody").textContent = q.e;
  $("next").classList.remove("hide");
  $("next").focus({preventScroll:true});
}
$("next").onclick=()=>{ if(idx<round.length-1){ idx++; render(); } else finish(); };

document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide")) return;
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const b=$("opts").children[parseInt(e.key,10)-1]; if(b) b.click();
  } else if(answered && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); $("next").click(); }
});

function finish(){
  const right=results.filter(Boolean).length;
  $("score").textContent=right+" / "+round.length;
  const pct=right/round.length;
  $("scoreNote").textContent = pct===1 ? "Alles sitzt." : pct>=0.7 ? "Solide, die Lücken stehen unten." : "Da ist noch Luft – die Punkte unten lohnen sich.";
  $("redo").classList.toggle("hide", missed.length===0);
  $("missBox").classList.toggle("hide", missed.length===0);
  $("missList").innerHTML = missed.map(q=>
    '<article><p class="mq">'+q.q+'</p><p class="ma">'+q.o[q.a]+'</p></article>').join("");
  info(); show("end");
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
